schema_version: "1.0"
workflow:
  id: "gdd-change"
  name: "GDD · one change, from Build to Release"
  version: "0.2.0"
  author: "Marcela Gotta"
  description: "Build → G2 → Integrate → G3 → Release → G4 for a change prepared by the Orchestrator. Launch it with bin/gdd launch <change>."

requires:
  speckit_version: ">=1.2.0"
  integrations:
    any: ["claude", "codex", "opencode"]

# The change id arrives through the GDD_CHANGE environment variable (set by bin/gdd launch).
# No shell step interpolates agent text: they only read files and variables.
inputs:
  change:
    type: string
    required: true
    prompt: "Change id"
  g4:
    type: string
    default: ""
    prompt: "G4 verdict (approve or reject). Empty: the workflow pauses and waits for a human."

steps:
  # ------------------------------------------------ 2 · Build
  - id: prep
    type: shell
    run: "bin/gdd prepare"
    output_format: json

  - id: testsfirst
    type: if
    condition: "{{ steps.prep.output.data.tests_first and not steps.prep.output.data.resume_green }}"
    then:
      - id: buildtest
        command: speckit.gdd.build-test
        integration: "{{ steps.prep.output.data.builder_test.integration }}"
        model: "{{ steps.prep.output.data.builder_test.model }}"
        capture: true
        capture_max_bytes: -1
        timeout: 3600
        input:
          args: "change={{ steps.prep.output.data.change }} mode=test"
      - id: guardtest
        type: shell
        run: "bin/gdd guard --role builder-test --strict"
        output_format: json
      - id: snapbuild
        type: shell
        run: "bin/gdd snapshot --name build"
        output_format: json

  - id: buildstage
    type: if
    condition: "{{ not steps.prep.output.data.resume_green }}"
    then:
      - id: buildloop
        type: do-while
        max_iterations: 3
        condition: "{{ not steps.g2.output.data.ok }}"
        steps:
          - id: build
            command: speckit.gdd.build
            integration: "{{ steps.prep.output.data.builder.integration }}"
            model: "{{ steps.prep.output.data.builder.model }}"
            capture: true
            capture_max_bytes: -1
            timeout: 3600
            input:
              args: "change={{ steps.prep.output.data.change }} mode=build"
          - id: g2
            type: shell
            run: "bin/gdd g2 --role builder-build"
            output_format: json

  - id: rescueg2
    type: if
    condition: "{{ not steps.prep.output.data.resume_green and not steps.g2.output.data.ok }}"
    then:
      - id: replan
        command: speckit.gdd.replan
        integration: "{{ steps.prep.output.data.orchestrator.integration }}"
        model: "{{ steps.prep.output.data.orchestrator.model }}"
        capture: true
        capture_max_bytes: -1
        timeout: 3600
        input:
          args: "change={{ steps.prep.output.data.change }} reason=g2"
      - id: replannext
        type: shell
        run: "bin/gdd next"
        output_format: json
      - id: retest
        type: if
        condition: "{{ steps.replannext.output.data.test }}"
        then:
          - id: snapretest
            type: shell
            run: "bin/gdd snapshot"
            output_format: json
          - id: buildtestreplan
            command: speckit.gdd.build-test
            integration: "{{ steps.prep.output.data.builder_test.integration }}"
            model: "{{ steps.prep.output.data.builder_test.model }}"
            capture: true
            capture_max_bytes: -1
            timeout: 3600
            input:
              args: "change={{ steps.prep.output.data.change }} mode=test after=replan"
          - id: guardretest
            type: shell
            run: "bin/gdd guard --role builder-test --strict --since-snapshot"
            output_format: json
          - id: snapbuildretest
            type: shell
            run: "bin/gdd snapshot --name build"
            output_format: json
      - id: buildreplan
        command: speckit.gdd.build
        integration: "{{ steps.prep.output.data.builder.integration }}"
        model: "{{ steps.prep.output.data.builder.model }}"
        capture: true
        capture_max_bytes: -1
        timeout: 3600
        input:
          args: "change={{ steps.prep.output.data.change }} mode=build after=replan"
      - id: g2replan
        type: shell
        run: "bin/gdd g2 --role builder-build"
        output_format: json
      - id: parkg2
        type: if
        condition: "{{ not steps.g2replan.output.data.ok }}"
        then:
          - id: parkg2end
            type: shell
            run: "bin/gdd park 'G2 still red after 3 retries and 1 replan'"

  # ------------------------------------------------ 3 · Integrate
  - id: g3
    type: shell
    run: "bin/gdd g3 --role builder-build"
    output_format: json

  - id: fixg3
    type: if
    condition: "{{ not steps.g3.output.data.ok }}"
    then:
      - id: buildg3
        command: speckit.gdd.build
        integration: "{{ steps.prep.output.data.builder.integration }}"
        model: "{{ steps.prep.output.data.builder.model }}"
        capture: true
        capture_max_bytes: -1
        timeout: 3600
        input:
          args: "change={{ steps.prep.output.data.change }} mode=build fix=g3"
      - id: g2g3
        type: shell
        run: "bin/gdd g2 --role builder-build"
        output_format: json
      - id: g3again
        type: shell
        run: "bin/gdd g3 --role builder-build"
        output_format: json
      - id: parkg3
        type: if
        condition: "{{ not steps.g3again.output.data.ok }}"
        then:
          - id: parkg3end
            type: shell
            run: "bin/gdd park 'G3 still red after one fix'"

  - id: review
    type: if
    condition: "{{ steps.prep.output.data.reviewer }}"
    then:
      - id: reviewer
        command: speckit.gdd.review
        integration: "{{ steps.prep.output.data.reviewer_model.integration }}"
        model: "{{ steps.prep.output.data.reviewer_model.model }}"
        capture: true
        capture_max_bytes: -1
        timeout: 3600
        input:
          args: "change={{ steps.prep.output.data.change }} round=1"
      - id: verdict
        type: shell
        run: "bin/gdd verdict"
        output_format: json
      - id: fixreview
        type: if
        condition: "{{ not steps.verdict.output.data.ok }}"
        then:
          - id: buildreview
            command: speckit.gdd.build
            integration: "{{ steps.prep.output.data.builder.integration }}"
            model: "{{ steps.prep.output.data.builder.model }}"
            capture: true
            capture_max_bytes: -1
            timeout: 3600
            input:
              args: "change={{ steps.prep.output.data.change }} mode=build fix=review"
          - id: g2review
            type: shell
            run: "bin/gdd g2 --role builder-build"
            output_format: json
          - id: g3review
            type: shell
            run: "bin/gdd g3 --role builder-build"
            output_format: json
          - id: reviewer2
            command: speckit.gdd.review
            integration: "{{ steps.prep.output.data.reviewer_model.integration }}"
            model: "{{ steps.prep.output.data.reviewer_model.model }}"
            capture: true
            capture_max_bytes: -1
            timeout: 3600
            input:
              args: "change={{ steps.prep.output.data.change }} round=2"
          - id: verdict2
            type: shell
            run: "bin/gdd verdict"
            output_format: json
          - id: parkreview
            type: if
            condition: "{{ not steps.verdict2.output.data.ok or not steps.g3review.output.data.ok }}"
            then:
              - id: parkreviewend
                type: shell
                run: "bin/gdd park 'Reviewer KO or G3 red after one fix'"

  - id: g3open
    type: shell
    run: "bin/gdd gate G3 ok --by machines --note 'automatic chain and Reviewer'"

  - id: merge
    type: shell
    run: "bin/gdd merge"
    output_format: json

  # ------------------------------------------------ 4 · Release
  - id: pre
    type: shell
    run: "bin/gdd release pre"
    output_format: json

  - id: g4human
    type: if
    condition: "{{ steps.prep.output.data.g4 }}"
    then:
      - id: inboxg4
        type: shell
        run: "bin/gdd inbox"
      - id: g4
        type: gate
        message: "G4 · Release Gate: check the pre demo and the change message. Promote to production?"
        show_file: ".gdd/changes/{{ steps.prep.output.data.change }}/inbox.md"
        options: [approve, reject]
        verdict_input: g4
        on_reject: abort

  - id: promote
    type: shell
    run: "bin/gdd release promote"
    output_format: json

  - id: observe
    type: shell
    run: "bin/gdd release observe"
    output_format: json

  - id: close
    type: shell
    run: "bin/gdd inbox"
