<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 250" role="img" aria-label="The five gates of GDD, G0 to G4" font-family="Inter, system-ui, sans-serif">
<rect width="100%" height="100%" rx="14" fill="#0d1020"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffb36b"/></marker></defs>
<text x="20" y="38" fill="#e8eaf6" font-size="18" font-weight="700">One change, five gates</text>
<text x="20" y="58" fill="#a3a9cc" font-size="12">Purple: a person decides. The rest: machines and agents.</text>
<rect x="20" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="95.0" y="112" text-anchor="middle" fill="#4fd18b" font-size="22" font-weight="800">G0</text>
<text x="95.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Harness</text>
<text x="95.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">machines</text>
<line x1="173" y1="128" x2="194" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="198" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#d6a6ff" stroke-width="2"/>
<text x="273.0" y="112" text-anchor="middle" fill="#d6a6ff" font-size="22" font-weight="800">G1</text>
<text x="273.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Scenarios</text>
<text x="273.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">you approve</text>
<line x1="351" y1="128" x2="372" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="376" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="451.0" y="112" text-anchor="middle" fill="#4fd18b" font-size="22" font-weight="800">G2</text>
<text x="451.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Build</text>
<text x="451.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">tests, lint, scope</text>
<line x1="529" y1="128" x2="550" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="554" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#8fa2ff" stroke-width="2"/>
<text x="629.0" y="112" text-anchor="middle" fill="#8fa2ff" font-size="22" font-weight="800">G3</text>
<text x="629.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Integrate</text>
<text x="629.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">mutation, security, Reviewer</text>
<line x1="707" y1="128" x2="728" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="732" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#d6a6ff" stroke-width="2"/>
<text x="807.0" y="112" text-anchor="middle" fill="#d6a6ff" font-size="22" font-weight="800">G4</text>
<text x="807.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Release</text>
<text x="807.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">you: OK · KO · polish</text>
<text x="20" y="210" fill="#a3a9cc" font-size="12">Risk sets how strict each gate is:</text>
<circle cx="215" cy="206" r="6" fill="#4fd18b"/><text x="227" y="210" fill="#e8eaf6" font-size="12">green: fewest checks</text>
<circle cx="365" cy="206" r="6" fill="#ffcc66"/><text x="377" y="210" fill="#e8eaf6" font-size="12">yellow: more</text>
<circle cx="465" cy="206" r="6" fill="#ff6b6b"/><text x="477" y="210" fill="#e8eaf6" font-size="12">red: every check, plus a plan you approve</text>
</svg>
