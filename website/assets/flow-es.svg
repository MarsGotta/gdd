<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 250" role="img" aria-label="Las cinco puertas de GDD, de G0 a G4" font-family="Inter, system-ui, sans-serif">
<rect width="100%" height="100%" rx="14" fill="#0d1020"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffb36b"/></marker></defs>
<text x="20" y="38" fill="#e8eaf6" font-size="18" font-weight="700">Un Change, cinco puertas</text>
<text x="20" y="58" fill="#a3a9cc" font-size="12">Morado: decide una persona. El resto: máquinas y agentes.</text>
<rect x="20" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="95.0" y="112" text-anchor="middle" fill="#4fd18b" font-size="22" font-weight="800">G0</text>
<text x="95.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Arnés</text>
<text x="95.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">máquinas</text>
<line x1="173" y1="128" x2="194" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="198" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#d6a6ff" stroke-width="2"/>
<text x="273.0" y="112" text-anchor="middle" fill="#d6a6ff" font-size="22" font-weight="800">G1</text>
<text x="273.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Escenarios</text>
<text x="273.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">los apruebas tú</text>
<line x1="351" y1="128" x2="372" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="376" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="451.0" y="112" text-anchor="middle" fill="#4fd18b" font-size="22" font-weight="800">G2</text>
<text x="451.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Construir</text>
<text x="451.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">tests, lint, alcance</text>
<line x1="529" y1="128" x2="550" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="554" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#8fa2ff" stroke-width="2"/>
<text x="629.0" y="112" text-anchor="middle" fill="#8fa2ff" font-size="22" font-weight="800">G3</text>
<text x="629.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Integrar</text>
<text x="629.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="9.2">mutación, seguridad, Reviewer</text>
<line x1="707" y1="128" x2="728" y2="128" stroke="#ffb36b" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="732" y="80" width="150" height="96" rx="12" fill="#1a1f3d" stroke="#d6a6ff" stroke-width="2"/>
<text x="807.0" y="112" text-anchor="middle" fill="#d6a6ff" font-size="22" font-weight="800">G4</text>
<text x="807.0" y="136" text-anchor="middle" fill="#e8eaf6" font-size="14" font-weight="600">Salida</text>
<text x="807.0" y="158" text-anchor="middle" fill="#a3a9cc" font-size="10.5">tú: OK · KO · polish</text>
<text x="20" y="196" fill="#a3a9cc" font-size="12">El riesgo fija lo estricta que es cada puerta:</text>
<circle cx="26" cy="222" r="6" fill="#4fd18b"/><text x="38" y="226" fill="#e8eaf6" font-size="12">verde: menos controles</text>
<circle cx="200" cy="222" r="6" fill="#ffcc66"/><text x="212" y="226" fill="#e8eaf6" font-size="12">amarillo: más</text>
<circle cx="320" cy="222" r="6" fill="#ff6b6b"/><text x="332" y="226" fill="#e8eaf6" font-size="12">rojo: todos, y un plan que apruebas</text>
</svg>
