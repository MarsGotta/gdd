name: docs

# Builds the documentation website (English and Spanish) from docs/ on every pull request, and
# publishes it to GitHub Pages (https://gdd.marsgotta.com) on every push to main. No untrusted input
# from the event reaches a shell. Actions are pinned to full commit SHAs and uv to an exact
# version (Zensical runs through uvx, pinned in scripts/build_site.py); only the deploy job, which runs no repository code, may write to Pages.
on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "zensical.toml", "scripts/build_site.py", "scripts/check_*.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "zensical.toml", "scripts/build_site.py", "scripts/check_*.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # this workflow publishes the site
      - name: Check the docs and build the site, failing on any warning
        run: |
          python3 scripts/check_md_links.py .
          python3 scripts/check_translation.py
          python3 scripts/build_site.py
      # v4 pins its own actions/upload-artifact by SHA (v3 used a tag).
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
