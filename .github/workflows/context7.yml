name: context7

# Asks Context7 (https://context7.com/marsgotta/gdd) to index the documentation again when it
# changes on main, so coding agents that use Context7 read the current docs. It needs the
# repository secret CONTEXT7_API_KEY (from https://context7.com/dashboard); without it, the job
# says so and passes. What Context7 indexes is set in context7.json. No input from the event
# reaches the shell and no repository code runs.
on:
  push:
    branches: [main]
    paths: ["docs/**", "*.md", "context7.json", ".github/workflows/context7.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: context7
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Context7 to index the docs again
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::notice::No CONTEXT7_API_KEY secret: Context7 refreshes the docs on its own schedule."
            exit 0
          fi
          curl -fsS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -d '{"libraryName": "/marsgotta/gdd"}'
