name: gdd
# G2 and G3 in CI: they block even if an agent skips a workflow step.
on:
  pull_request:
  push:
    branches: ["main", "change/**"]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-mutants
      - name: Install gitleaks (checksum verified)
        run: |
          V=8.30.1; D=$(mktemp -d); cd "$D"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt
          grep "gitleaks_${V}_linux_x64.tar.gz" gitleaks_${V}_checksums.txt | sha256sum -c -
          sudo tar -xzf gitleaks_${V}_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Plain checks on main
        if: github.ref == 'refs/heads/main'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings -W clippy::cognitive_complexity
          cargo test --workspace --locked
      - name: gdd from the main branch (the judge is the version before the change)
        run: |
          git worktree add -q "$RUNNER_TEMP/judge" origin/main
          (cd "$RUNNER_TEMP/judge" && cargo build -q --release --locked)
          sudo install -m 755 "$RUNNER_TEMP/judge/target/release/gdd" /usr/local/bin/gdd
      - name: GDD gates (Path Guard, G2, G3)
        run: gdd ci
