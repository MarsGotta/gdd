schema_version: "1.1"
name: a-check-that-fails-without-the-change-stops-the-build
description: The same typo, in a shop where a test already fails on main, on a text the change doesn't touch, and nobody recorded it as debt. The orchestrator finds that the failure isn't the change's, launches no build under it, records no debt by itself and asks the person one thing, with what it would do.
tags: [orchestrator, green, person]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: says-it-in-about-a-hundred-words
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.){700,}"'
    match: not_contains
    weight: 2
  - name: names-no-branch-or-commit
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:\b[Bb]ranch|\b[Cc]ommit|\bworktree|gdd/debt)'
    match: not_contains
    weight: 2
  - name: launches-no-build-under-it
    type: tool_used
    tool: Agent
    input_match: 'gdd-build'
    min: 0
    max: 2
    weight: 3
  - name: records-no-debt-by-itself
    type: regex
    target: files
    pattern: 'gdd/debt\.md'
    match: not_contains
    weight: 3
  - name: leaves-the-failing-test-as-it-was
    type: regex
    target: { source: file, path: tests/test_texts.py }
    pattern: 'assertEqual\(\(TEXTS / "empty-cart\.txt"\)\.read_text\(\)\.strip\(\), "Your cart is empty"\)'
    weight: 3
  - name: ships-nothing-under-it
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyrigth'
    weight: 2
  - name: logs-that-it-waits-for-the-person
    type: regex
    target: trace
    pattern: 'event[\\"]{1,8}\s?:\s?[\\"]{1,8}ask'
    weight: 2
  - name: asks-one-thing-in-plain-words
    type: llm
    criteria: The answer tells the person that a test already failed before this change, on something the change doesn't touch, and that the typo fix hasn't shipped. It says what it would do about it and asks one question that a yes or a no answers. It doesn't offer a list of technical options without saying which one it would take, and it doesn't quote the skills or their files to justify the question.
    weight: 2
