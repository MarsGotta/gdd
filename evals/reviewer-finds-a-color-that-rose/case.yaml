schema_version: "1.1"
name: reviewer-finds-a-color-that-rose
description: A change briefed as green also touched a file of a yellow zone. The reviewer says so and leaves the review of the new color to another launch.
tags: [role, review]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator as the reviewer of one change. Load the `gdd-review` skill and follow it.

    The change is `fix-footer`, on the branch `work/fix-footer` of this repository. The request was: "Fix the typo in the footer, and add the count of items it is going to show." It was briefed as green, so it has no brief and nothing was sealed. Its log is `gdd/log/fix-footer.jsonl`, here in my copy: its `brief` step has `<base>`, which is also `<start>`.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: finds-yellow
    type: regex
    pattern: '^COLOR:\s*yellow'
    flags: mi
    weight: 3
  - name: names-the-path
    type: regex
    pattern: 'src/cart\.py'
    weight: 2
  - name: leaves-the-full-review-for-another-launch
    type: regex
    target: trace
    pattern: 'From the second round on'
    match: not_contains
  - name: gives-a-verdict
    type: regex
    pattern: '^\s*(pass|fix|stop)\b'
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report\s*\nskill: gdd-review'
