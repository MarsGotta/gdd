schema_version: "1.1"
name: prepare-leaves-a-blueprint-to-approve
description: A shop without GDD, and a person who comes with most of it decided. Prepare writes the blueprint, the constitution and the backlog, proposes rules for the payments zone, tries each level by command line when available, builds no check itself and stops for the person's approval.
tags: [orchestrator, prepare]
runs: 3
execution:
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  prompt: |
    I want to work on this shop with GDD from now on. Prepare it. I've already decided most of it:

    - Payments (src/pay) are the delicate part. The texts are harmless. The cart and its tests are in between.
    - On every change I want the tests to pass, the code to compile and no secret to get into the repository. Nothing else for now.
    - I work only from Claude Code. Use haiku for the light level, sonnet for the standard one and opus for the deep one, and the same three for the reviewer.
    - There's no platform and no CI, and I don't want them yet: a change ships when its branch is merged into main.
    - We have no history to take a baseline from. Keep the usual limits, and nothing may be skipped in an emergency.

    Propose whatever is left yourself, write the files and show me the blueprint to approve. Don't stop to ask me before that.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: opens-gdd-prepare
    type: regex
    target: trace
    pattern: 'Propose first, ask afterwards'
  - name: opens-how-the-levels-are-decided
    type: regex
    target: trace
    pattern: 'A level counts once you.ve seen it launch'
  - name: writes-the-block-of-the-agents-file
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: 'This project uses Gate-Driven Development \(contract gdd/1\)'
  - name: gives-the-constitution-a-scan-for-secrets
    type: regex
    target: { source: file, path: gdd/constitution.md }
    pattern: '[Ss]ecret[^|\n]*\|\s*`[^`\n]+`'
  - name: leaves-the-runner
    type: regex
    target: files
    pattern: 'gdd/check\.sh'
    weight: 2
  - name: gives-the-commands-through-the-runner
    type: regex
    target: { source: file, path: gdd/constitution.md }
    pattern: 'sh gdd/check\.sh [a-z0-9-]+ -- \S'
    weight: 2
  - name: lists-the-scan-among-the-checks
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '-\s*id:\s*secrets\b'
    weight: 2
  - name: links-the-payment-zone-to-its-feature
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '^([ \t]+)- id:[ \t]*([\w-]+)[ \t]*$(?=(?:\n\1[ \t][^\n]*)*?\n\1[ \t]+-[^\n]*src/pay/)(?:\n\1[ \t][^\n]*)*?\n\1[ \t]+gates:[ \t]*gdd/gates/\2\.feature\b'
    flags: m
    weight: 2
  # In the payment feature, both scenarios of every proposed rule carry the reviewer tag.
  - name: gives-the-payment-zone-its-reviewed-rules
    type: regex
    target: trace
    pattern: '@zone:(?:pay[\w-]*|money|billing|checkout)\b(?:(?!\\n[ \t]*(?:Rule|Scenario):|\\n(?:[\w-]+(?:\\n|")|@(?:zone|gate):)|(?<!\\)").)*?(?:\\n[ \t]*Rule:(?:(?:(?!\\n[ \t]*(?:Rule|Scenario):|\\n(?:[\w-]+(?:\\n|")|@(?:zone|gate):)|(?<!\\)").)*?@check:review\b(?:[ \t]|\\n|@[\w:-]+)*Scenario:){2,}(?:(?!\\n[ \t]*(?:Rule|Scenario):|\\n(?:[\w-]+(?:\\n|")|@(?:zone|gate):)|(?<!\\)").)*?){3,}(?=\\n(?:[\w-]+(?:\\n|")|@(?:zone|gate):)|(?<!\\)"|$)'
    weight: 3
  - name: gives-it-no-more-than-five
    type: regex
    target: trace
    pattern: '@zone:(?:pay[\w-]*|money|billing|checkout)\b(?:(?:(?!\\n[ \t]*Rule:|\\n(?:[\w-]+(?:\\n|")|@(?:gate|zone):)|(?<!\\)").)*?\\n[ \t]*Rule:){6}'
    match: not_contains
    weight: 1
  # Stop at the next Rule and at the end of the written feature (JSON string or shell heredoc).
  - name: checks-what-the-payment-rules-protect
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)gdd/gates/(pay[\w-]*|billing|money|checkout)\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)[ \t]*@zone:\1\b(?:\\n[ \t]*)+Feature:
      (?:[^"\\\n]|\\(?!n).)*(?:(?:\\n[ \t]*)+Rule:
      (?=[^"\\]*\b(?:charg\w*|pay\w*|paid|amount|total|price|stock|cart|order|buyer|customer|card|key|secret|refund\w*|receipt|money|provider|cents?)\b)(?=(?:(?!\\n[ \t]*Rule:|\\n[\w-]+(?:\\n|")|(?<!\\)").)*?\\n[ \t]*Scenario:(?:[^"\\\n]|\\(?!n).)*(?:\\n[ \t]*(?:(?:Given|When|And|But) (?:[^"\\\n]|\\(?!n).)*)?)*\\n[ \t]*Then
      [^"\\]*\b(?:breach|violat\w*|fail(?:s|ed)?|reject(?:s|ed)?|stops?|block(?:s|ed)?|(?:buyer|customer) is charged twice|two charges)\b)(?=(?:(?!\\n[ \t]*Rule:|\\n[\w-]+(?:\\n|")|(?<!\\)").)*?\\n[ \t]*Scenario:(?:[^"\\\n]|\\(?!n).)*(?:\\n[ \t]*(?:(?:Given|When|And|But) (?:[^"\\\n]|\\(?!n).)*)?)*\\n[ \t]*Then
      (?![^"\\]*\b(?:breach|violat\w*|fail(?:s|ed)?|reject(?:s|ed)?|stops?|block(?:s|ed)?|(?:buyer|customer) is charged twice|two charges)\b)[^"\\]*\b(?:pass(?:es)?|accept(?:s|ed)?|through|same|kept|only|exactly|once|one|no|never|unpaid|paid|still|charg\w*|receives?|remain\w*|cents?)\b)(?:(?!\\n[ \t]*Rule:|\\n[\w-]+(?:\\n|")|(?<!\\)").)*?){3,5}(?=\\n(?:[\w-]+(?:\\n|")|")|(?<!\\)")
    flags: i
    weight: 2
  - name: proposes-distinct-payment-rules
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)gdd/gates/(pay[\w-]*|billing|money|checkout)\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)[ \t]*@zone:\1\b(?:(?!\\n[\w-]+(?:\\n|")|(?<!\\)").)*?\\n[ \t]*Rule:[ \t]+([^"\\]+)\\n(?:(?!\\n[\w-]+(?:\\n|")|(?<!\\)").)*?\\n[ \t]*Rule:[ \t]+\2(?=\\n|")
    flags: i
    match: not_contains
    weight: 1
  # Check both tags at the start of the scenario, even when they occupy separate lines.
  - name: tags-machine-checkable-payment-outcomes
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)gdd/gates/(pay[\w-]*|billing|money|checkout)\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)[ \t]*@zone:\1\b(?:(?!(?<!\\)"|\\n[\w-]+(?:\\n|")).)*?\\n[ \t]*(?:Rule:|Then |And |But )(?:[^"\\\n]|\\[^n\n])*(?:\\n[ \t]*)+(?!(?=(?:@[\w:-]+(?:[ \t]|\\n)+)*@check:review\b)(?=(?:@[\w:-]+(?:[ \t]|\\n)+)*@check:tests\b))(?:@[\w:-]+(?:[ \t]|\\n)+)*Scenario:
      (?:[^"\\\n]|\\[^n\n])*(?:\\n[ \t]*(?:(?:Given|When|And|But) (?:[^"\\\n]|\\[^n\n])*)?)*\\n[ \t]*Then
      [^"\\]*\b(?:\d+ cents|exactly (?:\d+|the (?:total|amount))|(?:no (?:new|second)|one) charge|charg(?:ed|es) (?:once|twice)|(?:tests?|test suite) (?:fails?|pass(?:es)?))\b
    flags: i
    match: not_contains
  - name: tags-secret-exposures-for-the-scan-and-review
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)gdd/gates/(pay[\w-]*|billing|money|checkout)\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)[ \t]*@zone:\1\b(?:(?!(?<!\\)"|\\n[\w-]+(?:\\n|")).)*?\\n[ \t]*(?:Rule:|Then |And |But )(?:[^"\\\n]|\\[^n\n])*(?:\\n[ \t]*)+(?!(?=(?:@[\w:-]+(?:[ \t]|\\n)+)*@check:review\b)(?=(?:@[\w:-]+(?:[ \t]|\\n)+)*@check:secrets\b))(?:@[\w:-]+(?:[ \t]|\\n)+)*Scenario:
      (?:[^"\\]*(?:card number|key|secret)[^"\\]*(?:stor\w*|logg\w*|commit\w*|written|reaches)|(?:[^"\\\n]|\\[^n\n])*(?:\\n[ \t]*(?:(?:Given|When|And|But) (?:[^"\\\n]|\\[^n\n])*)?)*\\n[ \t]*Then
      [^"\\]*\bsecrets? (?:check |scan )?(?:fails?|passes))
    flags: i
    match: not_contains
  - name: writes-each-gate-as-a-feature
    type: regex
    target: files
    pattern: 'gdd/gates/[a-z0-9-]+\.feature'
    weight: 3
  - name: names-its-gates-in-the-blueprint
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '(?:^|\n)gates:[^\n]*\n\s+- id:'
    weight: 2
  - name: says-what-breaks-a-check
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\n\s+breaks:\s*\S'
    weight: 2
  - name: builds-no-check-itself
    type: regex
    target: files
    pattern: '(?:[Ss]ecret|[Ss]can|[Ll]eak)[^/\n]*\.(?:py|sh|js|ts)\b'
    match: not_contains
    weight: 2
  - name: leaves-mutation-out-of-red
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\bred:\s*\n\s*checks:\s*\[[^\]\n]*mutation'
    match: not_contains
    weight: 2
  - name: asks-for-brief-approval-on-yellow
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\byellow:\s*\n\s*checks:\s*\[[^\]\n]*brief-approval'
  - name: says-when-each-check-runs
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\n\s+runs:\s*(?:each round|before review)\b'
    weight: 2
  - name: gives-each-color-its-limits
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\ncolors:[\s\S]*?\n\s{4}limits:\s*\n\s{6}[a-z_]+:\s*\d'
    weight: 2
  - name: shows-the-table-of-checks
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '\|\s*Check\s*\|\s*What it catches\s*\|\s*When it runs'
  - name: leaves-the-counter
    type: regex
    target: files
    pattern: 'gdd/limits\.sh'
  - name: marks-payments-red
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'color:\s*red[^\n]*\n\s*paths:[^\n]*\n(?:\s*-[^\n]*\n)*?\s*-[^\n]*src/pay'
  - name: says-the-guarantee-is-a-rule
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'guarantee:\s*rule\b'
  - name: gives-each-level-its-model-by-its-environment
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'levels:[^\n]*\n(?:\s*#[^\n]*\n)*\s+claude[\w-]*:[^\n]*\n[\s\S]*?launch:[^\n]*(?:<model>|[Aa]gent[^\n]*model)[\s\S]*?light:\s*\S*haiku[\s\S]*?standard:\s*\S*sonnet[\s\S]*?deep:\s*\S*opus'
    weight: 3
  - name: checks-whether-the-cli-can-launch-a-role
    type: tool_used
    tool: Bash
    input_match: '(?:\b(?:command\s+-v|which|type(?:\s+-[a-zA-Z]+)?)\s+claude\b|\bclaude\s+(?:-p\b|--(?:print|model|help|version|output-format)\b))'
  # A probe can be a Claude CLI call or a model-selected Agent call when the CLI is unavailable.
  # When a shell loop supplies the model at runtime, accept a usage result only when it names a single model.
  - name: tries-the-light-level
    type: regex
    target: trace
    pattern: '"name":"Agent","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"model":"[\w.-]*haiku[\w.-]*"|"name":"Bash","input":\{"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n)\s*)?(?:env\s+(?:-u\s+\w+\s+)?|\w+=\S*\s+)*(?:timeout\s+\d+[smh]?\s+)?(?:[\w./-]+/)?claude\s+(?![^;&|\\"]*--(?:help|version)\b)(?=(?:[^;&|"\\]|\\")*?(?:-p|--print)\b)(?:[^;&|"\\]|\\")*?--model[=\s]+(?:\\"|'')?[\w.-]*haiku\b|\\"modelUsage\\"\s*:\s*\{\s*\\"[\w.-]*haiku[\w.-]*\\"\s*:\s*\{[^{}]*\}\s*\}'
  - name: tries-the-standard-level
    type: regex
    target: trace
    pattern: '"name":"Agent","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"model":"[\w.-]*sonnet[\w.-]*"|"name":"Bash","input":\{"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n)\s*)?(?:env\s+(?:-u\s+\w+\s+)?|\w+=\S*\s+)*(?:timeout\s+\d+[smh]?\s+)?(?:[\w./-]+/)?claude\s+(?![^;&|\\"]*--(?:help|version)\b)(?=(?:[^;&|"\\]|\\")*?(?:-p|--print)\b)(?:[^;&|"\\]|\\")*?--model[=\s]+(?:\\"|'')?[\w.-]*sonnet\b|\\"modelUsage\\"\s*:\s*\{\s*\\"[\w.-]*sonnet[\w.-]*\\"\s*:\s*\{[^{}]*\}\s*\}'
  - name: tries-the-deep-level
    type: regex
    target: trace
    pattern: '"name":"Agent","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"model":"[\w.-]*opus[\w.-]*"|"name":"Bash","input":\{"command":"(?:(?:[^"\\]|\\.)*?(?:&&|;|\||\\n)\s*)?(?:env\s+(?:-u\s+\w+\s+)?|\w+=\S*\s+)*(?:timeout\s+\d+[smh]?\s+)?(?:[\w./-]+/)?claude\s+(?![^;&|\\"]*--(?:help|version)\b)(?=(?:[^;&|"\\]|\\")*?(?:-p|--print)\b)(?:[^;&|"\\]|\\")*?--model[=\s]+(?:\\"|'')?[\w.-]*opus\b|\\"modelUsage\\"\s*:\s*\{\s*\\"[\w.-]*opus[\w.-]*\\"\s*:\s*\{[^{}]*\}\s*\}'
  - name: logs-the-light-probe
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"levels"\s*:\s*\[[^\]]*?\{(?=[^{}]*"level"\s*:\s*"light")(?=[^{}]*"launch"\s*:\s*"[^"]+")(?=[^{}]*"model"\s*:\s*"[^"]*haiku)'
  - name: logs-the-standard-probe
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"levels"\s*:\s*\[[^\]]*?\{(?=[^{}]*"level"\s*:\s*"standard")(?=[^{}]*"launch"\s*:\s*"[^"]+")(?=[^{}]*"model"\s*:\s*"[^"]*sonnet)'
  - name: logs-the-deep-probe
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"levels"\s*:\s*\[[^\]]*?\{(?=[^{}]*"level"\s*:\s*"deep")(?=[^{}]*"launch"\s*:\s*"[^"]+")(?=[^{}]*"model"\s*:\s*"[^"]*opus)'
  - name: logs-it-in-the-shape-of-the-contract
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"contract"\s*:\s*"gdd/1"[^\n]*"step"\s*:\s*"prepare"'
    weight: 2
  - name: logs-the-blueprint-as-proposed
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"step"\s*:\s*"prepare"[^\n]*"result"\s*:\s*"proposed"'
    weight: 2
  - name: opens-the-backlog-with-the-standing-checks
    type: regex
    target: { source: file, path: gdd/backlog.md }
    pattern: '\|\s*standing-checks\s*\|[^\n]*\|\s*todo\s*\|'
    weight: 2
  - name: sets-up-no-check-before-the-approval
    type: regex
    target: files
    pattern: 'gdd/log/standing-checks'
    match: not_contains
    weight: 2
  - name: invites-corrections-to-the-payment-rules
    type: regex
    pattern: 'gdd/gates/[^\n]*\b(?:correct (?:it|them|any|the|my|a)|(?:you (?:to|can|may|should)|please) correct)\b'
    flags: i
    weight: 2
  - name: asks-the-person-to-approve
    type: llm
    criteria: The answer names the blueprint and the other files to read and asks the person to approve them together before building starts. It tells them what checks still need to be set up or tried and when. Asking “Do you approve them as they are?” after listing the files covers the blueprint. It does not say the project is ready for changes now.
    weight: 3
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: the-layer-wrote-the-prepare-step
    type: regex
    target: { source: file, path: gdd/log/blueprint.engine.jsonl }
    pattern: '"wrote"\s*:\s*\{[^}]*"step"\s*:\s*"prepare"'
    weight: 1
