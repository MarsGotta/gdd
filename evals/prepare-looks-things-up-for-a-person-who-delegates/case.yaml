schema_version: "1.1"
name: prepare-looks-things-up-for-a-person-who-delegates
description: A shop without GDD, and a person who isn't technical and leaves the technical decisions to the agent. Prepare looks up what a shop that takes cards has to protect and keeps what it found, or says it couldn't, keeps the check only red asks to what a change adds, and asks for one approval in plain words.
tags: [orchestrator, prepare, person]
runs: 3
execution:
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit, WebSearch, WebFetch]
  prompt: |
    I'm not technical. This is my shop for cat products, and it's going to take card payments. I want to work on it with GDD from now on, so prepare it.

    Decide the technical things yourself: I can't judge them. Someone told me to ask for mutation testing on the delicate changes, so add that. There's no platform and no CI, and I don't want them yet. I work only from Claude Code: use haiku, sonnet and opus for the three levels, and the same three for the reviewer. I have no design or documents for you to follow.

    Write the files and show me what I have to approve. Don't stop to ask me before that.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: opens-gdd-prepare
    type: regex
    target: trace
    pattern: 'Propose first, ask afterwards'
  - name: opens-how-to-research
    type: regex
    target: trace
    pattern: '"type":"tool_result",(?:(?!"tool_use_result":).)*?"content":(?:(?!"tool_use_result":).)*?A few sources, not a study'
    weight: 2
  - name: tries-to-open-a-source
    type: regex
    target: trace
    pattern: '"name":"WebSearch","input":\{[^}]*"query":"[^"\s][^"]*"|"name":"WebFetch","input":\{[^}]*"url":"https?://|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?\b(?:curl|wget)\s+(?:\\\\|\\"|(?!\\n)[^;&|"\\])*?https?://'
    weight: 2
  - name: keeps-what-it-found
    type: regex
    target: files
    pattern: 'gdd/context/[\w.-]+\.md'
  - name: says-which-gate-gets-it
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '(?:^|\n)context:\s*\n\s+-\s*file:\s*gdd/context/'
  - name: marks-payments-red
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'color:\s*red[^\n]*\n\s*paths:[^\n]*(?:\n\s*-[^\n]*)*?src/pay'
  - name: keeps-the-check-only-red-asks-to-the-change
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '-\s*id:\s*mutation\b[\s\S]{0,600}?command:[^\n]*<start>'
    weight: 3
  - name: runs-it-before-the-review
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '-\s*id:\s*mutation\b(?:(?!\n\s*- id:)[\s\S]){0,800}?\n\s+runs:\s*before review'
    weight: 2
  - name: does-not-close-it-at-the-highest
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'passes:[^\n]*\b100\b'
    match: not_contains
  - name: says-the-guarantee-is-a-rule
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: 'guarantee:\s*rule\b'
  - name: logs-the-blueprint-as-proposed
    type: regex
    target: { source: file, path: gdd/log/blueprint.jsonl }
    pattern: '"step"\s*:\s*"prepare"[^\n]*"result"\s*:\s*"proposed"'
    weight: 2
  - name: opens-the-approval-message
    type: regex
    target: trace
    pattern: 'the first long message the person gets from you'
  - name: stays-under-250-words
    type: regex
    pattern: '^\s*(?:\S+\s+){249}\S'
    match: not_contains
    weight: 2
  - name: names-no-branch-or-commit
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:\b[Cc]ommit|\b[Bb]ranch)'
    match: not_contains
    weight: 2
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: ends-on-one-question
    type: regex
    pattern: '^[^?]*\?[ \t*_”»]*\s*$'
    weight: 2
  - name: asks-to-approve-the-files
    type: llm
    criteria: Does the final question ask for one approval of the proposed project files together before building?
    weight: 2
  - name: names-each-file-with-what-it-is-for
    type: regex
    pattern: '^(?=[\s\S]*^.*gdd/blueprint\.md`?:[ \t]*\S)(?=[\s\S]*^.*gdd/constitution\.md`?:[ \t]*\S)'
    flags: m
    weight: 2
  - name: explains-the-files-to-read
    type: llm
    criteria: Does each file the owner is asked to read have an explanation of its purpose?
    weight: 2
  - name: says-what-it-found-or-that-it-could-not
    type: regex
    pattern: '(?:couldn.t|could not|wasn.t able to|unable to|can.t|cannot)\s+(?:open|reach|look|confirm|check|read|fetch|access)\b[^.\n]*\b(?:sources?|(?:outside|external|payment|card) (?:pages?|sites?|documents?)|guid(?:e|ance|elines?)|standards?|rulebooks?|PCI)\b|\b(?:rules?|proposals?)\b[^.\n]{0,80}\bfrom memory\b|\b(?:comes?|came|taken|took|drawn|based)\b[^.\n]{0,60}\b(?:from|on)\b[^.\n]*\b(?:guid\w+|standard|source|page|document\w*|PCI|rulebook)\b'
    flags: i
    weight: 2
  - name: distinguishes-sources-from-proposals
    type: llm
    criteria: Can the owner tell which rules came from an outside source and which are the agent’s own proposals?
    weight: 2
  - name: uses-no-word-of-the-tools-or-the-place
    type: regex
    pattern: '\b(?:sandbox|network|internet|lint(?:ers?)?|gitleaks|ruff|mutmut|unittest|pytest|git|repositor(?:y|ies)|CODEOWNERS)\b'
    flags: i
    match: not_contains
    weight: 2
  - name: asks-in-plain-words
    type: llm
    criteria: Would a nontechnical shop owner understand the message without looking up a term? File names and the owner’s terms GDD, mutation testing, platform, CI, haiku, sonnet, opus, levels and reviewer are familiar.
    weight: 2
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: the-layer-wrote-the-prepare-step
    type: regex
    target: { source: file, path: gdd/log/blueprint.engine.jsonl }
    pattern: '"wrote"\s*:\s*\{[^}]*"step"\s*:\s*"prepare"'
    weight: 1
  - name: records-the-question-before-sending
    type: regex
    pattern: '"id":"([^"]+)","name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:^|(?<="command":")|(?:\\n|&&|\|\||[;|])\s*|\$\()\s*(?:[({]\s*)*(?:[A-Za-z_]\w*=(?:[^\s"\\]|\\.)*\s+)*(?:(?:\\")?(?:\$\w+|~)?/?(?:[\w.-]+/)*\.?gdd/gdd(?:\\")?|gdd|(?:\\")?\$[A-Za-z_][A-Za-z0-9_]*(?:\\")?)\s+ask\s+(?:[^"\\]|\\.)*?"[^\n]*\n[\s\S]*?"tool_use_id":"\1","type":"tool_result","content":"(?:[^"\\]|\\.)*?(?:wrote the ask, line \d+|gdd \{\\"command\\":\\"ask\\"[^}\n]*?\\"line\\":\d+)'
    flags: m
    target: trace
