schema_version: "1.1"
name: reviewer-sends-a-total-of-its-own
description: "A red change in payments, built and through its gates: the browser sends the items and the total it shows, and the change charges that total instead of working it out from the shop's prices, while its sealed tests send the right total. The reviewer opens the full review, sends a total of its own and asks for a fix that says the shop charges what the browser sends."
tags: [role, review]
runs: 3
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator as the reviewer of one change. Load the `gdd-review` skill and follow it.

    The change is `browser-pay`, on the branch `work/browser-pay` of this repository. It was briefed as red. Its log is `gdd/log/browser-pay.jsonl`, here in my copy: `<base>` is the base in its `brief` step, and `<start>` is the commit of its seal, in its `checks` step. Its gates already ran, and their result is in the log.
    Nothing comes before the verdict. Right above the gdd-report block, after the rest of your answer, give a json block with each command you ran: [{"command":"<command>","exit":0,"tail":"<its last lines>"}].
context:
  scaffold_script: scaffold.sh
graders:
  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: reads-the-full-review
    type: regex
    target: trace
    pattern: 'Some regressions show only side by side'
    weight: 2
  - name: answers-fix
    type: regex
    pattern: '^\s*fix\b'
    weight: 3
  - name: finds-it-charges-the-browsers-total
    type: llm
    criteria: Does a numbered finding say that the shop charges the total the browser sends instead of the total it works out from its own prices?
    weight: 3
  # First reading or review: no previous findings and no reviewed stamp in this prompt.
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report[ \t]*\r?\nskill: gdd-review\b[^\n]*\nresult:[ \t]*\S[^\n]*\ncaught:[ \t]*\S[^\n]*\nclosed:[ \t]*\r?\n(?:reviewed:(?![^\r\n]*(?<![A-Fa-f0-9])[A-Fa-f0-9]{40}(?![A-Fa-f0-9]))[^\r\n]*\r?\n)?```\s*$'
