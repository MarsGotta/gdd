schema_version: "1.1"
name: gdd-stays-out-no-gdd-function
description: A request the entry skill is not for. It must not load.
tags: [activation, stays-out]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add a function to cart.py that returns how many items the cart has.
context:
  scaffold_script: scaffold.sh
graders:

  - name: does-not-load-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
    min: 0
    max: 0
    arm: both
