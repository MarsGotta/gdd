schema_version: "1.1"
name: prepare-tries-the-zones-on-the-history
description: "A shop without GDD and with twenty-five commits of history. Before it asks the person to approve the blueprint, Prepare tries the colors and checks on those commits. Two lines give the counts in shop terms, where fixes fell and any gaps in the draft."
tags: [orchestrator, prepare, history]
runs: 3
execution:
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  prompt: |
    I want to work on this shop with GDD from now on. Prepare it. I've already decided most of it:

    - Payments (src/pay) are the delicate part. The texts are harmless. The cart and its tests are in between.
    - On every change I want the tests to pass, the code to compile and no secret to get into the repository. Nothing else for now.
    - I work only from Claude Code. Use haiku for the light level, sonnet for the standard one and opus for the deep one, and the same three for the reviewer.
    - There's no platform and no CI, and I don't want them yet: a change ships when its branch is merged into main.
    - The repository has a few weeks of history, and no figures for a baseline yet. Keep the usual limits, and nothing may be skipped in an emergency.

    Propose whatever is left yourself, write the files and show me the blueprint to approve. Don't stop to ask me before that.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: opens-how-an-existing-project-is-prepared
    type: regex
    target: trace
    pattern: 'The zones, tried on the history'
    weight: 2
  - name: counts-the-commits-of-a-zone
    type: regex
    target: trace
    pattern: 'rev-list --no-merges[^\n]{0,200}?-- '
    weight: 2
  - name: looks-for-the-fixes
    type: regex
    target: trace
    pattern: 'rev-list --no-merges[^\n]{0,80}?--grep'
    weight: 2
  - name: sets-up-no-check-before-the-approval
    type: regex
    target: files
    pattern: 'gdd/log/standing-checks'
    match: not_contains
    weight: 2
  - name: tells-the-person-what-the-history-shows
    type: regex
    pattern: 'Before you say yes[^\n]*\n(?:[ \t]*\n)?(?=(?:[^\n]*?(?:\b\d+\b(?:[ \t]+(?:were|the|touched|changed|affected|only|in))*[ \t]+(?:wording|texts?|notes?|copy|labels?|cart|basket|payments?|checkout)\b|\b(?:wording|texts?|notes?|copy|labels?|cart|basket|payments?|checkout)[ \t]*:[ \t]*\b\d+\b)){3})[^\n]*?(?:\b(?:payments?|checkout)(?: changes?)?\s*(?:(?:,\s*)?(?:includ(?:ed|ing)|had|accounted for|contained|saw|held|with)\s+(?:all |both |the |most |of |\d+ )*)?(?:fix(?:es)?|reverts?|corrections?)\b|\b(?:fix(?:es)?|reverts?|corrections?)\b[^.;\n]{0,65}?\b(?:in|touched|affected|were to|fell on|involved)\s+(?:the |card )?(?:payments?|checkout)\b)'
    flags: i
    weight: 1
  - name: gets-the-files-of-a-change
    type: tool_used
    tool: Bash
    input_match: '\bgit\s+(?:(?:-C\s+(?:\\"[^"\\]+\\"|[^\s;"|&]+)|--no-pager)\s+)*(?:diff-tree|show|diff|log)\s+(?:[^;&|"\\]|\\")*--name-(?:only|status)\b'
  - name: previews-the-checks-on-real-changes
    type: regex
    target: trace
    pattern: 'gdd \{\\"command\\":\\"color\\"(?:(?!\\n|gdd \{).)*?\\"on\\":\\"planned\\",\\"paths\\":\[\\"[^"\\\n]+\\"'
    weight: 1
  - name: checks-the-draft-zones
    type: tool_used
    tool: Bash
    input_match: '\b(?:gdd|GDD_BIN)(?:\\")?\s+zones\b'
  - name: gives-the-counts-and-coverage-in-two-lines
    type: regex
    pattern: 'Before you say yes[^\n]*\n(?:[ \t]*\n)?(?![^\n]*\b(?:red|yellow|green)\b)(?=(?:[^\d\n]*\d+\b){3})(?=[^\n]*\b(?:wording|texts?|copy|labels?)\b)(?=[^\n]*\b(?:cart|basket)\b)(?=[^\n]*\b(?:pay\w*|checkout)\b)[^\n]+\n[^\n]*(?:cover|miss|gap|skip|watch|unprotected|uncheck|untest|blind spot|outside (?:a |the |any |all )?(?:zones?|plan|checks?|coverage)|left out\b|no zone\b)'
    flags: i
    weight: 3
  - name: says-what-no-zone-covers
    type: regex
    target: { source: file, path: gdd/blueprint.md }
    pattern: '^zones:[ \t]*\n(?:[ \t][^\n]*\n)*?[ \t]+paths:[ \t]*(?:\[(?:[^,\]\n]+,[ \t]*)*|(?:\n[ \t]+-[^\n]*)*?\n[ \t]+-[ \t]*)[\x22\x27]?(?::\(glob\))?notes(?:/[^,\]\s\x22\x27#]*)?(?=[\s,\]\x22\x27]|$)'
    flags: m
    weight: 1
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: the-layer-wrote-the-prepare-step
    type: regex
    target: { source: file, path: gdd/log/blueprint.engine.jsonl }
    pattern: '"wrote"\s*:\s*\{[^}]*"step"\s*:\s*"prepare"'
    weight: 1
