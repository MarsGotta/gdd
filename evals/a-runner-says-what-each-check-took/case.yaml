schema_version: "1.1"
name: a-runner-says-what-each-check-took
description: The same typo, in a shop whose checks run through a runner of its own that times each command and ends with a line that says what it took. The log carries the seconds the runner gave.
tags: [orchestrator, green, runner]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: fixes-the-typo
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyright 2026'
    weight: 3
  - name: writes-no-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/'
    match: not_contains
    weight: 2
  - name: loads-gdd-brief
    type: regex
    target: trace
    pattern: 'Decisions nobody has made'
  - name: logs-the-color-before-building
    type: regex
    target: trace
    pattern: '^(?:(?!"name":"Agent")[\s\S])*?gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}brief[\\"]{1,8},[\\"]{1,8}color'
  - name: keeps-a-log
    type: regex
    target: files
    pattern: 'gdd/log/[a-z0-9-]+\.jsonl'
    weight: 2
  - name: logs-what-the-runner-said
    type: regex
    target: trace
    pattern: 'check[\\"]{1,8}\s?:\s?[\\"]{1,8}(?:tests|lint)[\\"]{1,8}\s?,\s?(?:[\\"]{1,8}result[\\"]{1,8}\s?:\s?[\\"]{1,8}\w+[\\"]{1,8}\s?,\s?)?[\\"]{1,8}seconds[\\"]{1,8}\s?:\s?0(?:\.0+)?\s?[,}]'
    weight: 2
  - name: launches-a-builder
    type: tool_used
    tool: Agent
    input_match: 'gdd-build'
    min: 1
    max: 3
    weight: 2
  - name: launches-a-reviewer
    type: tool_used
    tool: Agent
    input_match: 'gdd-review'
    min: 1
    max: 2
    weight: 2
  - name: launches-no-checks-agent
    type: tool_used
    tool: Agent
    input_match: 'gdd-checks'
    min: 0
    max: 0
  - name: tells-the-person-briefly
    type: llm
    criteria: The answer tells the person that the typo is fixed and shipped, that the change was green and that its gates passed, and it does not ask the person to approve the change.
  - name: runs-its-gates-through-the-layer
    type: regex
    target: trace
    pattern: 'gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}gates[\\"]{1,8},[^}]*?passed[\\"]{1,8}:true'
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
