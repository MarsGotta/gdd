schema_version: "1.1"
name: a-green-change-stays-light
description: A typo in a green zone, asked the way a person would. The orchestrator fixes it through its gates without a brief, a seal or a checks agent.
tags: [orchestrator, green]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: fixes-the-typo
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyright 2026'
    weight: 3
  - name: writes-no-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/'
    match: not_contains
    weight: 2
  - name: loads-gdd-brief
    type: regex
    target: trace
    pattern: 'Assumptions and open questions'
  - name: logs-the-color-before-building
    type: regex
    target: trace
    pattern: '^(?:(?!"name":"Agent")[\s\S])*?gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}brief[\\"]{1,8},[\\"]{1,8}color[\\"]{1,8}:[\\"]{1,8}green[\\"]'
  - name: keeps-a-log
    type: regex
    target: files
    pattern: 'gdd/log/[a-z0-9-]+\.jsonl'
    weight: 2
  - name: runs-its-gates-through-the-layer
    type: regex
    target: trace
    pattern: 'gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}gates[\\"]{1,8},[^}]*?passed[\\"]{1,8}:true'
  - name: logs-what-each-check-took
    type: regex
    target: trace
    pattern: 'check[\\"]{1,8}\s?:\s?[\\"]{1,8}[a-z0-9-]+[\\"]{1,8}\s?,\s?(?:[\\"]{1,8}result[\\"]{1,8}\s?:\s?[\\"]{1,8}\w+[\\"]{1,8}\s?,\s?)?[\\"]{1,8}seconds[\\"]{1,8}\s?:\s?\d'
  - name: launches-a-builder
    type: tool_used
    tool: Agent
    input_match: 'gdd-build'
    min: 1
    max: 3
    weight: 2
  - name: launches-a-reviewer
    type: tool_used
    tool: Agent
    input_match: 'gdd-review'
    min: 1
    max: 2
    weight: 2
  - name: launches-no-checks-agent
    type: tool_used
    tool: Agent
    input_match: 'gdd-checks'
    min: 0
    max: 0
  - name: says-the-footer-is-fixed
    type: regex
    pattern: '\b(?:footer|typo|copyright|copyrigth)\b[^.\n]{0,110}(?<!\b(?:not|never|\w+n[\x27’]t|to|will|would|could|should)(?:\s+(?:been|be|yet|now))?\s+)(?<!\b(?:nothing|nobody|no one|none of it)\s+(?:(?:has|was|is|been|yet)\s+)*)\b(?:fixed|correct(?:ed)?|now (?:says|reads|shows)(?!\s+["\x27“‘\x60]*copyrigth\b)|replaced|instead of ["''“‘`]*copyrigth)\b|(?<!\b(?:not|never|\w+n[\x27’]t|to|will|would|could|should)(?:\s+(?:been|be|yet|now))?\s+)(?<!\b(?:nothing|nobody|no one|none of it)\s+(?:(?:has|was|is|been|yet)\s+)*)\b(?:fixed|corrected|changed|replaced)\b[^.\n]{0,80}\b(?:typo|footer|copyrigth)\b'
    flags: i
  - name: says-it-is-in
    type: regex
    pattern: '(?<!\b(?:nothing|never|not|once|when|if|until|whether|before|after|wish|to|will|would|\w+n[\x27’]t)(?:\s+(?:it|this|the|change|fix|I|is|was|has|be|been|yet))*\s+)\b(?:(?:it(?:[\x27’]s| is| was)|(?:the )?(?:change|fix|typo|correction) (?:is|was)) (?:now )?(?:in(?=\s*$|\r?\n|[.!?,;:]|\s+(?:(?:the|your) (?:shop|store|product)|production|`?main)\b)|live\b|shipped\b|merged\b)|(?:has been|is|was|I) (?:merged|shipped)\b|merged (?:it |the fix )?(?:into|to) (?:the |`)?main\b)'
    flags: i
  - name: says-the-gates-passed
    type: regex
    pattern: '^(?![\s\S]*?\b(?:gates?|checks?|seal|lint|tests?)\b[ \t*:]*(?:(?:check|tests?|suite)\b[ \t*:]*)?(?:(?:has|have|still|also) )?(?:failed|fails|did(?: not|n[\x27’]t) pass)\b(?![\s\S]*?\b(?:all (?:\w+ )?(?:checks|gates|tests) (?:now )?(?:pass(?:ed)?|are green)|(?:checks|gates|tests) (?:now )?all pass(?:ed)?|(?:passed|cleared) (?:all|every) (?:the )?(?:checks?|gates?|tests?))\b))[\s\S]*?(?:(?<!\b(?:not|never|to|no|will|would|should|\w+n[\x27’]t)(?: all)?\s+)\b(?:passed|cleared) (?:all |every |the )*(?:checks?|gates?|tests?)\b|(?<!\b(?:no|not all|none of the)\s+)\b(?:gates?|checks?|seal|lint|tests?)\b(?:(?!\b(?:no(?:ne)?|not|never|\w+n[\x27’]t|fail(?:ed|ures?)?|on (?:the )?(?:unchanged|unmodified|base) (?:code|version))\b)[^.\n]){0,95}?\bpass(?:ed|es)?\b(?! on (?:the )?(?:unchanged|unmodified|base) (?:code|version)))'
    flags: i
  - name: asks-for-no-shipping-approval
    type: regex
    pattern: '(?:^|[.!?\n])[^.!?\n]*(?:(?:do you approve|may I|shall I|should I|can I|want me to|would you like me to|ok(?:ay)? (?:to|if I)|quieres que|apruebas|puedo)[^?!.\n]*\b(?:ship(?:ping(?=\s+(?:it|this|the (?:fix|change))))?\b|merg(?:e|ing)\b|releas(?:e|ing)\b|publish(?:ing)?\b|put (?:it|this|the \w+) in|go live|sub[ao]|subir|publi\w+|integr\w+)|(?:approve|apruebas) (?:it\b|(?:this|the) change\b|el cambio\b|this(?=\s*(?:now\s*)?\?))|¿[^?\n]*\b(?:lo|la) (?:subo|publico|integro|fusiono)\b)[^?!.\n]*\?'
    flags: im
    match: not_contains
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: gives-the-builder-the-request-word-for-word
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*gdd-build)(?=[\s\S]*The footer says\W{1,8}Copyrigth\W{1,8}Fix the typo)'
    min: 1
  - name: stays-under-100-words
    type: regex
    pattern: '^\s*(?:\S+\s+){99}\S'
    match: not_contains
  - name: records-any-question-before-sending
    type: regex
    pattern: '(?:"id":"([^"]+)","name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:^|(?<="command":")|(?:\\n|&&|\|\||[;|])\s*|\$\()\s*(?:[({]\s*)*(?:[A-Za-z_]\w*=(?:[^\s"\\]|\\.)*\s+)*(?:(?:\\")?(?:\$\w+|~)?/?(?:[\w.-]+/)*\.?gdd/gdd(?:\\")?|gdd|(?:\\")?\$[A-Za-z_][A-Za-z0-9_]*(?:\\")?)\s+ask\s+(?:[^"\\]|\\.)*?"[^\n]*\n[\s\S]*?"tool_use_id":"\1","type":"tool_result","content":"(?:[^"\\]|\\.)*?(?:wrote the ask, line \d+|gdd \{\\"command\\":\\"ask\\"[^}\n]*?\\"line\\":\d+)|(?<![\s\S])(?![\s\S]*?^(?=[^\n]*"type":"result")[^\n]*?"result":"(?:[^"\\]|\\.)*?[?¿])[\s\S]*$)'
    flags: m
    target: trace
