schema_version: "1.1"
name: a-check-waits-for-what-it-watches
description: "The blueprint names its gates, and one of its checks applies only to a change that touches payments. A typo in a text goes through the others, and that check is left out because the blueprint says so, not because anyone chose to skip it."
tags: [orchestrator, green, gates]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: fixes-the-typo
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyright 2026'
    weight: 3
  - name: logs-no-run-of-the-check-that-waits
    type: regex
    target: trace
    pattern: 'check[\\"]{1,8}\s*:\s*[\\"]{1,8}prices[\\"]{1,8}\s*,\s*[\\"]{1,8}command'
    match: not_contains
    weight: 3
  - name: gates-names-the-check-its-path-filter-excluded
    type: regex
    target: trace
    pattern: 'prices\s+skipped: the change touched none of'
    weight: 2
  - name: logs-the-checks-that-apply
    type: regex
    target: trace
    pattern: 'check[\\"]{1,8}\s*:\s*[\\"]{1,8}tests[\\"]{1,8}'
    weight: 2
  - name: launches-a-builder
    type: tool_used
    tool: Agent
    input_match: 'gdd-build'
    min: 1
    max: 3
    weight: 2
  - name: launches-a-reviewer
    type: tool_used
    tool: Agent
    input_match: 'gdd-review'
    min: 1
    max: 2
    weight: 2
  - name: says-the-footer-is-fixed
    type: regex
    pattern: '\b(?:footer|typo|copyright|copyrigth)\b[^.\n]{0,110}(?<!not )(?<!never )\b(?:fixed|correct(?:ed)?|now (?:says|reads|shows)|replaced|instead)\b|\b(?:fixed|corrected|changed|replaced)\b[^.\n]{0,80}\b(?:typo|footer|copyrigth)\b'
    flags: i
    weight: 2
  - name: says-it-is-in
    type: regex
    pattern: '(?<!not )(?<!never )\b(?:it.s|(?:the )?(?:change|fix|typo|correction) (?:is|was)) (?:in(?=[.!?,\s]*$|[.!?,]|\s+(?:the shop|your shop|production|`?main)\b)|live\b)|(?<!not )(?<!never )\b(?:has been|is|was|I) (?:merged|shipped)\b|(?<!not )(?<!never )(?<!to )\bmerged (?:it |the fix )?(?:into|to) (?:the |`)?main\b'
    flags: i
    weight: 2
  - name: says-the-gates-passed
    type: regex
    pattern: '(?:\b(?:all|gates?|checks?|seal|lint|tests?)\b[^.\n]{0,95}?(?<!not )(?<!never )(?<!failed to )\bpass(?:ed|es)?\b|\bpass(?:ed|es)? (?:all |the )*(?:checks|gates|tests)\b)'
    flags: i
    weight: 2
  - name: asks-for-no-approval
    type: regex
    pattern: '[?¿]'
    flags: im
    match: not_contains
    weight: 2
  - name: explains-the-check-that-waited
    type: regex
    pattern: '\bprices?\b(?![^.\n]*\b(?:skipped|not run|did not (?:run|apply)|didn.t (?:run|apply)|does(?:n.t| not) apply)\b[^.\n]*\b(?:nothing|no (?:file|change)|untouched|outside|didn.t|did not)\b[^.\n]*\bpay|[^.\n]*\b(?:skipped|did not apply)\b[^.\n]*\bpay[^.\n]*(?:unchanged|untouched|didn.t change))'
    flags: i
    match: not_contains
    weight: 2
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: stays-under-100-words
    type: regex
    pattern: '^\s*(?:\S+\s+){99}\S'
    match: not_contains
  - name: records-any-question-before-sending
    type: regex
    pattern: '(?:"id":"([^"]+)","name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:^|(?<="command":")|(?:\\n|&&|\|\||[;|])\s*|\$\()\s*(?:(?:[\w.-]+/)*\.?gdd/gdd|gdd|(?:\\")?\$[A-Za-z_][A-Za-z0-9_]*(?:\\")?)\s+ask\s+(?:[^"\\]|\\.)*?"[^\n]*\n[\s\S]*?"tool_use_id":"\1","type":"tool_result","content":"(?:[^"\\]|\\.)*?(?:wrote the ask, line \d+|gdd \{\\"command\\":\\"ask\\"[^}\n]*?\\"line\\":\d+)|(?<![\s\S])(?![\s\S]*?^(?=[^\n]*"type":"result")[^\n]*?"result":"(?:[^"\\]|\\.)*?[?¿])[\s\S]*$)'
    flags: m
    target: trace
