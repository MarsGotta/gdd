schema_version: "1.1"
name: without-the-layer-nothing-is-logged-by-hand
description: "The footer typo, in a copy of the shop where git left the layer out, as it leaves it out of every clone: .gdd/gdd isn't there. The orchestrator sets the layer up and takes the change through it, or tells the person in a line what it needs and stops. Either way it writes no line of the log by hand, and no builder works on a change the layer hasn't briefed."
tags: [orchestrator, green, layer]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 3
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 3
  - name: builds-nothing-the-layer-has-not-briefed
    type: regex
    target: trace
    pattern: '^(?:(?!gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}brief[\\"]{1,8},[\\"]{1,8}color)[\s\S])*?"subagent_type":\s*"(?:[\w-]+:)?gdd-build"'
    match: not_contains
    weight: 2
  - name: says-it-in-about-a-hundred-words
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.){800,}"'
    match: not_contains
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: sets-it-up-or-says-what-it-needs
    type: llm
    criteria: The answer does one of two things. Either it tells the person that the footer typo is fixed and in, with the checks that passed, once the project's GDD tool was set up, or it tells them in a line or two that the GDD tool this project needs isn't installed in this copy, what it takes to get it (such as building it, or installing Rust), and that nothing was changed or shipped meanwhile. It does not say the typo went in while also saying the tool is missing, and it does not offer to go on without the tool.
    weight: 3
