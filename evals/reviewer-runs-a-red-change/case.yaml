schema_version: "1.1"
name: reviewer-runs-a-red-change
description: A red change in payments, built and through its gates. The reviewer opens the full review, runs the change and tries to break it, tries the way back, and reports what it could observe at the provider for each payment scenario.
tags: [role, review]
runs: 3
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator as the reviewer of one change. Load the `gdd-review` skill and follow it.

    The change is `charge-once`, on the branch `work/charge-once` of this repository. It was briefed as red. Its log is `gdd/log/charge-once.jsonl`, here in my copy: `<base>` is the base in its `brief` step, and `<start>` is the commit of its seal, in its `checks` step. Its gates already ran, and their result is in the log.
    Before the gdd-report block, give a json block with each command you ran: [{"command":"<command>","exit":0,"tail":"<its last lines>"}].
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: reads-the-full-review
    type: regex
    target: trace
    pattern: 'Some regressions show only side by side'
    weight: 2
  - name: runs-the-change
    type: tool_used
    tool: Bash
    input_match: 'python3'
    min: 1
    weight: 2
  - name: gives-a-verdict
    type: regex
    pattern: '^\s*(pass|fix|stop)\b'
    weight: 2
  - name: gives-the-color
    type: regex
    pattern: '^COLOR:\s*red'
    flags: mi
  - name: says-what-it-ran
    type: regex
    pattern: '```json\s*\[\s*(?=\{)(?:\{(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"command"\s*:\s*"[^"])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"exit"\s*:\s*-?\d+\s*[,}])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"tail"\s*:\s*")(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?\}\s*(?:,\s*(?=\{)|(?=\])))*\]\s*```\s*```gdd-report\b'
    weight: 2
  - name: checks-what-the-provider-sees
    type: llm
    criteria: For the first charge, the same cart charged again and an empty cart, the report describes what the reviewer observed at the provider. If the running shop exposed only the amount returned, it identifies which provider effects the reviewer could not verify. A return value alone cannot establish that the provider received a charge.
    weight: 3
  - name: tries-the-way-back
    type: regex
    pattern: '^(?![^\n]*(?:did not|never|didn.t|would|should|might)\b)[^\n]*(?:\bgit(?:\s+-C\s+\S+)?\s+revert\b[^\x60\n]*?(?:\x60[ ,:]*|[ ,:]+)(?:exit(?:ed|s)?(?: code)?[ :=]+|returned )-?\d+\b|"command"\s*:\s*"(?:\s*|(?:[^"\\\n]|\\.)*?(?:&&|\|\||;)\s*)\bgit(?:\s+-C\s+\S+)?\s+revert\b(?:[^"\\\n]|\\.)*",\s*"exit"\s*:\s*-?\d+|\b(?:tried|tested|ran) the (?:way back|rollback)\b[^\n]*?\b(?:worked|failed|succeeded)\b)'
    flags: mi
    weight: 1
  # First reading or review: no previous findings and no reviewed stamp in this prompt.
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report[ \t]*\r?\nskill: gdd-review\b[^\n]*\nresult:[ \t]*\S[^\n]*\ncaught:[ \t]*\S[^\n]*\nclosed:[ \t]*\r?\n(?:reviewed:(?![^\r\n]*(?<![A-Fa-f0-9])[A-Fa-f0-9]{40}(?![A-Fa-f0-9]))[^\r\n]*\r?\n)?```\s*$'
  - name: tries-to-break-it
    type: regex
    pattern: '(?:\bcharge\([^\n)]*(?:-\d|\d+\.\d+|\bNone\b)[^\n)]*\)|\bcharge\(([^,\n)]+),[^\n)]*\)(?:(?!\b(?:would|could|should|might|expected)\b)[^.\n])*?\b(?:returned|gave|raised|printed|summed to|charged)\b[^\n]*?\bcharge\(\1,[^\n)]*\))(?:(?!\b(?:would|could|should|might|expected)\b)[^.\n])*?\b(?:returned|gave|raised|printed|summed to|charged)\b'
    flags: i
    weight: 2
