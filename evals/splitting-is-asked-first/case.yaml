schema_version: "1.1"
name: splitting-is-asked-first
description: "The same shop, and a request that crosses two red zones: customer accounts and paying by card. The orchestrator proposes doing it in parts before it briefs any of them, a line for each part with what it gives and about how long it takes, the first one showing the person something, and one question a yes answers, in under a hundred words. It writes no brief and launches no one."
tags: [orchestrator, brief, person]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    Que los clientes puedan crearse una cuenta y pagar con tarjeta lo que tienen en el carrito, de momento con el proveedor de pruebas de tools/fakepay.mjs.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: writes-no-brief-before-the-yes
    type: regex
    target: files
    pattern: 'gdd/briefs/(?!(?:catalog|cart)\.md$)[\w.-]+\.md$'
    flags: m
    match: not_contains
    weight: 3
  - name: writes-no-scenario-before-the-yes
    type: regex
    target: files
    pattern: 'features/(?!(?:catalog|cart)\.feature$)[\w.-]+\.feature$'
    flags: m
    match: not_contains
    weight: 2
  - name: launches-no-one
    type: tool_used
    tool: Agent
    input_match: 'gdd-'
    min: 0
    max: 0
    weight: 2
  - name: says-about-how-long-each-part-takes
    type: regex
    pattern: '\d+\s*(?:min|minutos|minutes)\b'
    flags: i
    weight: 2
  - name: asks-in-under-a-hundred-words
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.){800,}"'
    match: not_contains
    weight: 2
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: proposes-the-parts-for-a-yes
    type: llm
    criteria: The answer proposes doing the request in parts, before writing any of them, with a line for each part that says what it gives the customers and about how long it takes. The first part gives the person something they can see or use. It ends with one question that a yes answers, and it does not offer a menu of options without saying which one it would take.
    weight: 3
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
