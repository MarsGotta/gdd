schema_version: "1.1"
name: a-request-is-not-split
description: "Customers want one outcome: paying for their cart by card through the test provider. The orchestrator briefs it as one change, without proposing parts or asking whether to split it, and nobody writes checks or builds before the person approves that brief."
tags: [orchestrator, brief, person]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    Que los clientes puedan pagar con tarjeta lo que tienen en el carrito, de momento con el proveedor de pruebas de tools/fakepay.mjs.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: writes-a-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/(?!(?:catalog|cart)\.md$)[\w.-]+\.md$'
    flags: m
    match: contains
    weight: 2
  - name: writes-only-one-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/(?!(?:catalog|cart)\.md\n)[\w.-]+\.md\n(?:[^\n]*\n)*?gdd/briefs/(?!(?:catalog|cart)\.md(?:\n|$))[\w.-]+\.md'
    match: not_contains
    weight: 3
  - name: asks-no-decision-about-parts
    type: tool_used
    tool: Bash
    input_match: '\bask\s+(?:\S+\s+)?--of(?:\s+|=)decision\b'
    min: 0
    max: 0
    weight: 3
  - name: asks-for-brief-approval
    type: tool_used
    tool: Bash
    input_match: '\bask\s+(?:\S+\s+)?--of(?:\s+|=)brief\b'
    weight: 2
  - name: writes-no-tests-or-product-itself
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"(?:[^"]*/)?(?:src|tests)/'
    match: not_contains
    weight: 2
  - name: runs-no-checks-agent-or-builder
    type: tool_used
    tool: Bash
    input_match: '\blaunch\s+\S+\s+(?:checks|build)\s+[^;&|\n]*?--run\b'
    min: 0
    max: 0
    weight: 2
  - name: builds-nothing-before-the-yes
    type: tool_used
    tool: Agent
    input_match: 'gdd-(?:build|checks)'
    min: 0
    max: 0
    weight: 2
  - name: asks-in-under-a-hundred-and-fifty-words
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.){1100,}"'
    match: not_contains
    weight: 2
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: proposes-no-parts
    type: llm
    criteria: The answer treats the request as one change. It does not propose doing it in parts, list parts with how long each takes, or ask whether to split it. It asks the person to approve one brief covering payment by card through the test provider.
    weight: 3
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
