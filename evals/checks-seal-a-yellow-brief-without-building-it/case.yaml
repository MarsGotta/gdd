schema_version: "1.1"
name: checks-seal-a-yellow-brief-without-building-it
description: "A yellow change has two approved scenarios. The checks role reads each test before sealing and names a wrong solution it rejects. It sees each test fail on the base, builds no version of the change and reports each as seen rejecting and not seen passing."
tags: [role, checks]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator to write the checks of one change. Load the `gdd-checks` skill and follow it.

    The change is `empty-cart`, and it is yellow. Its brief is `gdd/briefs/empty-cart.md` and its scenarios are in `features/empty-cart.feature`, approved by the person and committed on `gdd-seal/empty-cart`. The base is the tip of `main`. Nobody has built anything.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-checks"'
  - name: sees-them-fail
    type: tool_used
    tool: Bash
    input_match: 'unittest'
    min: 1
  - name: writes-no-version-of-the-change
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"(?:[^"]*/)?cart\.py"|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:>>?\s*(?!&)|\btee\s+(?:-a\s+)?|\bsed\s+-i\b(?:(?!\\n)[^;|&"])*?\s)(?:\\?"|\x27)?(?:[^\s"\\;|&<>]*/)?cart\.py(?=\\?["\x27]|\\n|[\s;|&<>]|$)'
    match: not_contains
    weight: 3
  - name: edits-no-code-of-the-shop
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{"file_path":"[^"]*/src/'
    match: not_contains
    weight: 2
  - name: cites-each-scenario
    type: regex
    target: trace
    pattern: 'gdd:empty-cart-1[\s\S]*?gdd:empty-cart-2|gdd:empty-cart-2[\s\S]*?gdd:empty-cart-1'
  - name: seals-them
    type: tool_used
    tool: Bash
    input_match: 'git[^\n]*commit'
    weight: 2
  - name: says-not-seen-passing
    type: regex
    pattern: '\b(?:(?:not|never|haven[''’]t|hasn[''’]t|hadn[''’]t)(?:\s+(?:yet|been))?\s+seen(?:\s+(?:any|one|of|them|these|the|tests?|it|all))*\s+pass(?:ing)?|none (?:of \w+ )?(?:has |have |was |were )?(?:been )?seen pass(?:ing)?|seen [^.\n]{0,30}reject\w*[^.\n]{0,10}\bnot pass(?:ing)?|(?:did not|didn[''’]t|never) (?:see|saw)(?:\s+(?:any|one|of|them|these|the|tests?|it|all|each))*\s+pass(?:ing)?|saw none (?:of \w+ )?pass(?:ing)?)\b'
    flags: i
    weight: 3
  - name: does-not-stop
    type: regex
    pattern: 'CANNOT:'
    match: not_contains
  - name: names-test-and-wrong-in-every-rejecting-proof
    type: regex
    pattern: '```json\s*\[\s*\{(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"test"\s*:\s*"[^"\s])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"wrong"\s*:\s*"[^"\s])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"case"\s*:\s*"rejects")(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?\}(?:\s*,\s*\{(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"test"\s*:\s*"[^"\s])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"wrong"\s*:\s*"[^"\s])(?=(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?"case"\s*:\s*"rejects")(?:[^{}"\\]|"(?:[^"\\]|\\.)*")*?\})*\s*\]\s*```'
    weight: 3
  - name: each-test-rejects-its-wrong-solution
    type: llm
    criteria: For each scenario test reported, does its own proof name a concrete wrong solution that this test alone would reject?
    weight: 3
  # Follow the same saved log into tail, either by filename or through tee.
  - name: reads-the-end-of-saved-output
    type: regex
    target: trace
    pattern: '"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?\bunittest\b(?:[^;|&>"\\]|\\")*?(?:\s+(?:2>&1\s*)?\|\s*tee\s+(?:-a\s+)?[^\s|;&"]+\s*\|\s*tail\b|\s*(?:&?>|2>)\s*(?:\\"|'')?([\w.$/{}-]+)(?=[\s"''\\;&|]|$)(?:\\"|'')?(?:(?:[^"\\]|\\.)*?|(?:[^"\\]|\\.)*?"[\s\S]*?"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?)\btail\s+(?:(?:-n\s*|-)[1-9]\d*\s+)?(?:--\s+)?(?:\\"|'')?\1(?=[\s"''\\;&|]|$))'
  # Bash returns the test's exit directly when it runs alone. A compound command has to capture it.
  - name: keeps-the-test-exit-status
    type: tool_used
    tool: Bash
    input_match: '\bunittest\b(?:[^;|&"\\]|\\")*?(?:(?:2>&1\s*)?\|\s*tee\s+[^;&|"\\]+(?:\|\s*tail\b[^;&|"\\]*)?;\s*(?:[^;&|"\\]|\\")*?\$\{PIPESTATUS\[0\]\}|(?:&?>|2>)\s*(?:\\"[^"\\]+\\"|''[^'']+''|[^\s;"\\&|]+)(?:\s+2>&1)?\s*(?:"|(?:;\s*|\\n\s*)(?:[^;&|"\\]|\\")*?\$\?|\|\|\s*\w+=\$\?))'
  - name: avoids-repeating-a-full-file-read
    type: regex
    target: trace
    pattern: '"name":"Read","input":\{"file_path":"([^"]+)"\}(?:(?!"name":"(?:Bash|Write|Edit|MultiEdit)")[\s\S])*?"name":"Read","input":\{"file_path":"\1"\}'
    match: not_contains
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report\s*\nskill: gdd-checks[^\n]*\nresult: sealed'
    weight: 2
  - name: reports-the-seal-commit
    type: regex
    pattern: '\bseal(?:ed)?\b[^\n]{0,120}\b[0-9a-f]{7,40}\b'
    flags: i
    weight: 3
  - name: reports-each-test-failing-on-the-base
    type: llm
    criteria: Does the answer report seeing each new test fail on the original code?
    weight: 3
  - name: reports-no-yellow-implementation
    type: llm
    criteria: Does the report avoid claiming that the agent wrote or deliberately broke a version of the requested behavior?
    weight: 3
  - name: tests-only-the-sealed-scenarios
    type: llm
    criteria: Does every reported test exercise behavior requested by an empty-cart scenario? Further examples of the same behavior count.
    weight: 3
  - name: lists-gaps-under-missing
    type: llm
    criteria: Are any gaps the agent identifies listed under MISSING?
    weight: 3
