schema_version: "1.1"
name: a-brief-gets-a-second-reading
description: The draft payment brief leaves out stock and the outcome of a declined card. Its new scenarios have no parent rule. The reading runs nothing and proposes at most three additions, including corrections to the form of the brief.
tags: [role, review, brief]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator to read a brief before anyone builds it. Load the `gdd-review` skill and follow it.

    The draft is `gdd/briefs/card-payment.md`, with its scenarios in `features/card-payment.feature`, here in my copy and not sealed yet. The base is the tip of `main`. Nobody has built anything.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: opens-how-a-brief-is-read
    type: regex
    target: trace
    pattern: 'Reading a brief before anyone builds it'
    weight: 2
  - name: answers-fix
    type: regex
    pattern: '^\s*fix\b'
    weight: 3
  - name: names-the-stock
    type: regex
    pattern: '\b(?:stock|existencias|inventory)\b'
    flags: i
    weight: 3
  - name: gives-the-color
    type: regex
    pattern: '^COLOR:\s*red'
    flags: mi
  - name: runs-nothing
    type: tool_used
    tool: Bash
    input_match: 'unittest|python3 -m|\bnode\b'
    min: 0
    max: 0
    weight: 2
  - name: builds-nothing
    type: regex
    target: files
    pattern: 'src/pay/'
    match: not_contains
  # First reading or review: no previous findings and no reviewed stamp in this prompt.
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report[ \t]*\r?\nskill: gdd-review\b[^\n]*\nresult:[ \t]*\S[^\n]*\ncaught:[ \t]*\S[^\n]*\nclosed:[ \t]*\r?\n(?:reviewed:(?![^\r\n]*(?<![A-Fa-f0-9])[A-Fa-f0-9]{40}(?![A-Fa-f0-9]))[^\r\n]*\r?\n)?```\s*$'
  - name: identifies-the-risk-to-stock
    type: llm
    criteria: Does the reading explain why this omission could sell stock the shop no longer has?
    weight: 2
  - name: requests-the-stock-rule-with-its-scenario
    type: llm
    criteria: Does a numbered finding require a stock rule with a scenario beneath it showing what another buyer sees after payment?
    weight: 2
  - name: marks-proposed-stock-timing-as-assumed
    type: llm
    criteria: Is timing chosen by the reader explicitly proposed as an assumed rule?
    weight: 2
  - name: grounds-the-stock-correction
    type: llm
    criteria: Does the stock finding cite the constitution’s stock rule or explain the money a customer could lose?
    weight: 2
  - name: names-the-declined-card-scenario
    type: regex
    pattern: '\bcard-payment-2\b'
    weight: 2
  - name: clarifies-the-declined-card-outcome
    type: llm
    criteria: Does the reader ask for a concrete observable outcome so the declined-card test can be written?
    weight: 2
  - name: numbers-at-most-three
    type: regex
    pattern: '(?:^[ \t]*(?:[-*][ \t]+)?\**f\d+\b[\s\S]*?){4}|^[ \t]*(?:[-*][ \t]+)?\**f(?:[4-9]|\d{2,})\b'
    flags: mi
    match: not_contains
    weight: 3
  - name: gives-each-finding-one-line
    type: regex
    pattern: '^[ \t]*(?:[-*•][ \t]+|\d+[.)][ \t]+)?\**f\d+\b[^\n]*\n(?:[ \t]*\n)*[ \t]*(?:[-*•]|\d+[.)])(?=[ \t])(?![ \t]+\**f\d+\b)'
    flags: mi
    match: not_contains
    weight: 3
  - name: cites-what-each-finding-protects
    type: regex
    pattern: '^[ \t]*(?:[-*][ \t]+)?\**f\d+\b(?![^\n]*(?:\s\|\s|\b(?:rule|scenario)s?\s+(?:[`"“‘]|\d)|@id:[\w-]+|\b(?:money|data)\b))[^\n]*$'
    flags: mi
    match: not_contains
    weight: 3
  - name: finds-the-scenarios-without-a-rule
    type: regex
    pattern: '\bno (?:parent )?rules?[:\x60* ]+(?:above|over)\b|\b(?:without|lacks?|missing) (?:a|any|its|their) (?:parent )?rule\b|\b(?:not|never|aren[\x27’]t) (?:grouped |placed |nested )?under a rule\b|\b(?:put|place|group) (?:each|every|the(?: three)?|these) scenarios? under (?:a|its|their) rule\b|\b(?:none|neither) of (?:the|these|its)(?: \w+)? scenarios? ha(?:s|ve) a (?:parent )?rule\b'
    flags: i
    weight: 3
  - name: keeps-clarifications-under-missing
    type: regex
    pattern: '^MISSING:[ \t]*\n(?:[ \t]*[-*] [^\n]+\n?)+'
    flags: m
    weight: 3
  - name: asks-one-correction-per-finding
    type: llm
    criteria: Does each numbered finding ask for exactly one correction? A rule with its scenario counts as one correction.
    weight: 3
  - name: grounds-each-addition
    type: llm
    criteria: Does each numbered addition identify what it protects? Form corrections name the affected rule or scenario. Other additions name a constitution or zone rule, or the money or data at risk.
    weight: 3
  - name: separates-test-clarifications
    type: llm
    criteria: Are gaps in the testability of existing scenarios confined to unnumbered MISSING entries, apart from cross-references to a numbered form finding?
