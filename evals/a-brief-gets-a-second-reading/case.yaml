schema_version: "1.1"
name: a-brief-gets-a-second-reading
description: The draft payment brief leaves out stock and the outcome of a declined card. Its new scenarios have no parent rule. The reading runs nothing and proposes at most three additions, including corrections to the form of the brief.
tags: [role, review, brief]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator to read a brief before anyone builds it. Load the `gdd-review` skill and follow it.

    The draft is `gdd/briefs/card-payment.md`, with its scenarios in `features/card-payment.feature`, here in my copy and not sealed yet. The base is the tip of `main`. Nobody has built anything.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: opens-how-a-brief-is-read
    type: regex
    target: trace
    pattern: 'Reading a brief before anyone builds it'
    weight: 2
  - name: answers-fix
    type: regex
    pattern: '^\s*fix\b'
    weight: 3
  - name: names-the-stock
    type: regex
    pattern: '\b(?:stock|existencias|inventory)\b'
    flags: i
    weight: 3
  - name: gives-the-color
    type: regex
    pattern: '^COLOR:\s*red'
    flags: mi
  - name: runs-nothing
    type: tool_used
    tool: Bash
    input_match: 'unittest|python3 -m|\bnode\b'
    min: 0
    max: 0
    weight: 2
  - name: builds-nothing
    type: regex
    target: files
    pattern: 'src/pay/'
    match: not_contains
  # First reading or review: no previous findings and no reviewed stamp in this prompt.
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report[ \t]*\r?\nskill: gdd-review\b[^\n]*\nresult:[ \t]*\S[^\n]*\ncaught:[ \t]*\S[^\n]*\nclosed:[ \t]*\r?\n(?:reviewed:[ \t]*\r?\n)?```\s*$'
  - name: finds-what-paying-does-to-the-stock
    type: llm
    criteria: The answer finds that the shop could sell stock it no longer has. It asks for the stock rule and a scenario beneath it showing what another buyer sees afterwards in the catalog or cart. Stock timing proposed by the agent is an assumption. It ties the proposed correction to the constitution's rule that nothing is sold without stock, or to the money a customer would lose.
    weight: 2
  - name: catches-what-the-checks-role-would-need
    type: llm
    criteria: The reading names card-payment-2 and explains what its test would need to observe when a payment is declined, such as no charge and the message shown to the customer. It gives the orchestrator a concrete correction before approval.
    weight: 2
  - name: limits-the-additions
    type: llm
    criteria: The reading proposes at most three additions in total. The reading identifies the new scenarios that lack a parent rule. That form finding counts toward the three and needs no separate risk. Other form corrections name the affected brief rule. Each other addition cites a rule of the constitution or a named zone, or says what money or data could be lost. Count the actual additions even if several share a numbered line. Clarifications needed to test existing scenarios are unnumbered under MISSING. Further suggestions may go under LATER without counting as proposed corrections for this brief.
    weight: 3
