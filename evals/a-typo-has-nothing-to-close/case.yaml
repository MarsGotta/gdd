schema_version: "1.1"
name: a-typo-has-nothing-to-close
description: "A typo in a green zone. The orchestrator takes it through its gates with no brief file, writes no lines about what would close it, ships it, and asks the person nothing about whether it helped: a change that promises nothing to whoever uses the shop closes by itself."
tags: [orchestrator, green, close]
runs: 3
execution:
  max_turns: 100
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: fixes-the-typo
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyright 2026'
    weight: 3
  - name: writes-no-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/'
    match: not_contains
    weight: 2
  - name: ships-it
    type: regex
    target: trace
    pattern: 'gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}ship[\\"][^\n]*?[\\"]{1,8}next[\\"]{1,8}:[\\"]{1,8}(?:done|close)[\\"]'
    weight: 2
  - name: starts-no-close
    type: regex
    target: trace
    pattern: 'gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}close[\\"]|--of close '
    match: not_contains
    weight: 3
  - name: asks-for-no-verdict
    type: regex
    pattern: '(?:did it (?:serve|help)|whether it (?:served|helped)|verdict|¿(?:ha )?(?:servido|sirvi[óo])|veredicto)'
    flags: i
    match: not_contains
    weight: 3
  - name: says-the-typo-is-fixed-and-in
    type: llm
    criteria: Does the message say the footer typo is fixed and already in?
    weight: 2
  - name: stays-under-100-words
    type: regex
    pattern: '^\s*(?:\S+\s+){99}\S'
    match: not_contains
    weight: 2
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
