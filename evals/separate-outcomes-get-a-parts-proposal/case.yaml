schema_version: "1.1"
name: separate-outcomes-get-a-parts-proposal
description: "Customers can use accounts and card payments separately. The orchestrator proposes both parts and waits for the person's decision before briefing either one, writing checks or building."
tags: [orchestrator, brief, person]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    Que los clientes puedan crearse una cuenta y pagar con tarjeta lo que tienen en el carrito, de momento con el proveedor de pruebas de tools/fakepay.mjs.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: writes-no-new-brief
    type: regex
    target: files
    pattern: 'gdd/briefs/(?!(?:catalog|cart)\.md$)[\w.-]+\.md$'
    flags: m
    match: not_contains
    weight: 2
  - name: asks-for-a-decision-before-briefing
    type: tool_used
    tool: Bash
    input_match: '\bask\s+(?:\S+\s+)?--of(?:\s+|=)decision\b'
    weight: 3
  - name: runs-no-checks-agent-or-builder
    type: tool_used
    tool: Bash
    input_match: '\blaunch\s+\S+\s+(?:checks|build)\s+[^;&|\n]*?--run\b'
    min: 0
    max: 0
    weight: 2
  - name: writes-no-tests-or-product-itself
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"(?:[^"]*/)?(?:src|tests)/'
    match: not_contains
    weight: 2
  - name: builds-nothing-before-the-yes
    type: tool_used
    tool: Agent
    input_match: 'gdd-(?:build|checks)'
    min: 0
    max: 0
    weight: 2
  - name: stays-under-100-words
    type: regex
    pattern: '^\s*(?:\S+\s+){99}\S'
    match: not_contains
    weight: 2
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: ends-on-one-question
    type: regex
    pattern: '^[^?]*\?[ \t*_”»]*\s*$'
    weight: 3
  - name: estimates-each-part-on-its-line
    type: regex
    pattern: '(?:^(?=[^\n]*(?:cuenta|account))(?=[^\n]*(?:\d+(?:[–-]\d+)?|una?|one|two|half|media)\s*(?:min|hour|hora|día|day|week|semana))[^\n]+$\n[\s\S]*?^(?=[^\n]*(?:tarjeta|card|pagos?|payments?))(?=[^\n]*(?:\d+(?:[–-]\d+)?|una?|one|two|half|media)\s*(?:min|hour|hora|día|day|week|semana))[^\n]+$|^(?=[^\n]*(?:tarjeta|card|pagos?|payments?))(?=[^\n]*(?:\d+(?:[–-]\d+)?|una?|one|two|half|media)\s*(?:min|hour|hora|día|day|week|semana))[^\n]+$\n[\s\S]*?^(?=[^\n]*(?:cuenta|account))(?=[^\n]*(?:\d+(?:[–-]\d+)?|una?|one|two|half|media)\s*(?:min|hour|hora|día|day|week|semana))[^\n]+$)'
    flags: im
    weight: 3
  - name: proposes-two-usable-outcomes
    type: llm
    criteria: Are accounts and card payment proposed as independently usable parts, with something the owner can try from the first part?
    weight: 3
  - name: waits-for-the-parts-decision
    type: llm
    criteria: Does the message await a yes to those parts before briefing or starting either one?
    weight: 3
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: records-the-question-before-sending
    type: regex
    pattern: '"id":"([^"]+)","name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:^|(?<="command":")|(?:\\n|&&|\|\||[;|])\s*|\$\()\s*(?:(?:[\w.-]+/)*\.?gdd/gdd|gdd|(?:\\")?\$[A-Za-z_][A-Za-z0-9_]*(?:\\")?)\s+ask\s+(?:[^"\\]|\\.)*?"[^\n]*\n[\s\S]*?"tool_use_id":"\1","type":"tool_result","content":"(?:[^"\\]|\\.)*?(?:wrote the ask, line \d+|gdd \{\\"command\\":\\"ask\\"[^}\n]*?\\"line\\":\d+)'
    flags: m
    target: trace
