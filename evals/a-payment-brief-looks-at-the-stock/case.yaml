schema_version: "1.1"
name: a-payment-brief-looks-at-the-stock
description: "A shop with its catalog and its cart built, a constitution that says nothing is sold without stock, and orders a later item of the backlog. Asked to take card payments, the orchestrator briefs the change with a scenario that says what happens to stock when paying, proposes the stock rule in the brief approval, and tells them what the change won't do yet as a consequence. Paying is red, so nothing is built before the person approves: the run ends with a single question approving the scenarios and the proposed rule together."
tags: [orchestrator, brief, person]
runs: 3
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    Que se pueda pagar con tarjeta, de momento con el proveedor de pruebas de tools/fakepay.mjs.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: asks-the-seven-questions
    type: regex
    target: trace
    pattern: 'The paths say where a change lands'
    weight: 2
  - name: a-scenario-looks-at-the-stock
    type: regex
    target: trace
    pattern: 'features/[\w./-]+\.feature[^\n]{0,8000}?(?:Scenario|Escenario)[^\n]{0,3000}?(?:[Ss]tock|[Ee]xistencias|[Ii]nventari)'
    weight: 3
  - name: writes-what-it-wont-do-yet
    type: regex
    target: trace
    pattern: 'gdd/briefs/(?!(?:catalog|cart)\.md)[\w.-]+\.md[^\n]{0,6000}?#\s?(?:What it won.t do yet|Lo que (?:a[uú]n|todav[ií]a) no (?:hace|har[aá]))'
    weight: 2
  - name: builds-nothing-before-the-approval
    type: tool_used
    tool: Agent
    input_match: 'gdd-(?:build|checks)'
    min: 0
    max: 0
    weight: 3
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: proposes-the-shop-rule-in-the-approval
    type: llm
    criteria: The person gets one brief approval question. It includes a proposed rule of the shop, such as when payment takes an item out of stock, alongside the scenarios. The owner can approve the proposal and the brief with one yes.
    weight: 3
  - name: tells-what-it-wont-do-as-a-consequence
    type: llm
    criteria: The answer does one of two things. Either it says that paying will take what was paid out of stock, or it tells the person something the card payment won't do yet, put as a consequence they can weigh for their shop (for example that until orders exist the shop could sell what it no longer has, or that a payment is recorded to no one), and not only as what stays as it was (such as "it doesn't touch the stock").
    weight: 2
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
