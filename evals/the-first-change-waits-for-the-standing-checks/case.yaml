schema_version: "1.1"
name: the-first-change-waits-for-the-standing-checks
description: The blueprint is approved and nobody has set up the standing checks yet. Asked for a typo, the orchestrator sets them up once, has them tried and ships them, and only then takes the change through its gates.
tags: [orchestrator, prepare]
runs: 3
execution:
  max_turns: 150
  timeout_seconds: 3000
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    The footer says "Copyrigth". Fix the typo.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: opens-how-the-standing-checks-go
    type: regex
    target: trace
    pattern: 'It has no brief, and its color is the one its paths give'
  - name: launches-a-checks-agent
    type: tool_used
    tool: Agent
    input_match: 'gdd-checks'
    min: 1
    max: 3
    weight: 2
  - name: has-the-checks-tried-and-the-change-reviewed
    type: tool_used
    tool: Agent
    input_match: 'gdd-review'
    min: 2
    max: 6
    weight: 2
  - name: launches-no-role-without-its-model
    type: tool_used
    tool: Agent
    input_match: '^(?![\s\S]*"model"\s*:)[\s\S]*gdd-(?:checks|build|review)'
    min: 0
    max: 0
    weight: 3
  - name: sets-the-checks-up-on-the-standard-model
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*gdd-checks)(?=[\s\S]*"model"\s*:\s*"[^"]*sonnet)'
    min: 1
  - name: builds-the-typo-on-the-light-model
    type: tool_used
    tool: Agent
    input_match: '^(?=[\s\S]*gdd-build)(?=[\s\S]*"model"\s*:\s*"[^"]*haiku)'
    min: 1
  - name: has-them-tried-before-anyone-builds
    type: regex
    target: trace
    pattern: '^(?:(?!"subagent_type":\s*"(?:gdd:)?gdd-build")[\s\S])*?"subagent_type":\s*"(?:gdd:)?gdd-review"'
    weight: 2
  - name: logs-a-trial-that-passed
    type: regex
    target: { source: file, path: gdd/log/standing-checks.jsonl }
    pattern: '"step"\s*:\s*"review"[^\n]*"verdict"\s*:\s*"pass"'
    weight: 2
  - name: closes-their-log-with-a-ship
    type: regex
    target: { source: file, path: gdd/log/standing-checks.jsonl }
    pattern: '"step"\s*:\s*"ship"'
    weight: 3
  - name: keeps-secrets-out-of-their-log
    type: regex
    target: { source: file, path: gdd/log/standing-checks.jsonl }
    pattern: 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{10,}|xox[abp]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY'
    match: not_contains
    weight: 2
  - name: takes-the-scanner-as-it-is
    type: regex
    target: files
    pattern: '(?:[Ss]ecret|[Ss]can|[Ll]eak)[^/\n]*\.(?:py|sh|js|ts)\b'
    match: not_contains
    weight: 2
  - name: writes-no-scenarios-for-a-zone
    type: regex
    target: files
    pattern: 'gdd/gates/[^/\n]+\.feature'
    match: not_contains
    weight: 2
  - name: marks-the-item-done
    type: regex
    target: { source: file, path: gdd/backlog.md }
    pattern: '\|\s*standing-checks\s*\|[^\n]*\|\s*done\s*\|'
    weight: 2
  - name: launches-a-builder
    type: tool_used
    tool: Agent
    input_match: 'gdd-build'
    min: 1
    max: 3
    weight: 2
  - name: keeps-a-log-of-the-change
    type: regex
    target: files
    pattern: 'gdd/log/(?!standing-checks|blueprint)[a-z0-9-]+\.jsonl'
    weight: 2
  - name: fixes-the-typo
    type: regex
    target: { source: file, path: src/texts/footer.txt }
    pattern: 'Copyright 2026'
    weight: 3
  - name: tells-the-person-both-things
    type: llm
    criteria: The answer says that the project's standing checks were set up before the change, and that the typo is fixed and shipped. It may list points that were left for later, but it does not ask the person to approve anything before the change ships.
    weight: 2
