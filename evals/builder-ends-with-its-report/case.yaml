schema_version: "1.1"
name: builder-ends-with-its-report
description: A small yellow change that can be built. The builder commits on its branch, leaves the sealed test alone and ends with its evidence and its report.
tags: [role, build]
runs: 3
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator as the builder of one change. Load the `gdd-build` skill and follow it.

    The change is `empty-cart`. Its brief is `gdd/briefs/empty-cart.md`, and you are on your branch, `work/empty-cart`, which starts at its seal.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-build"'
  - name: builds-it
    type: regex
    target: { source: file, path: src/cart.py }
    pattern: 'def summary'
    weight: 2
  - name: sealed-test-untouched
    type: regex
    target: { source: file, path: tests/test_summary.py }
    pattern: '3 items, 0\.15'
    weight: 2
  - name: runs-its-gates
    type: tool_used
    tool: Bash
    input_match: 'unittest'
  - name: commits-on-its-branch
    type: tool_used
    tool: Bash
    input_match: 'git[^\n]*commit'
    weight: 2
  - name: does-not-stop
    type: regex
    pattern: 'CANNOT:'
    match: not_contains
  - name: gives-its-evidence
    type: regex
    pattern: 'python3 -m unittest'
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report\s*\nskill: gdd-build[^\n]*\nresult: done'
    weight: 2
