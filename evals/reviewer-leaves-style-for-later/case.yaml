schema_version: "1.1"
name: reviewer-leaves-style-for-later
description: A yellow change that does what its brief says for any input, with the same formatting written twice. The reviewer reads it against its brief without running it, passes it and leaves the duplication under LATER, for the backlog.
tags: [role, review]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    You were launched by the GDD orchestrator as the reviewer of one change. Load the `gdd-review` skill and follow it.

    The change is `empty-cart`, on the branch `work/empty-cart` of this repository. It was briefed as yellow. Its log is `gdd/log/empty-cart.jsonl`, here in my copy: `<base>` is the base in its `brief` step, and `<start>` is the commit of its seal, in its `checks` step. Its gates already ran, and their result is in the log.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-its-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd-review"'
  - name: passes-it
    type: regex
    pattern: '^\s*pass\b'
    weight: 3
  - name: leaves-the-duplication-for-later
    type: regex
    pattern: 'LATER:[\s\S]*?\b(?:duplicat\w*|repeat\w*|twice|copied|same (?:code|formatting|format\w*))'
    flags: i
    weight: 3
  - name: does-not-run-the-tests
    type: tool_used
    tool: Bash
    input_match: 'unittest'
    min: 0
    max: 0
    weight: 2
  - name: keeps-to-the-yellow-review
    type: regex
    target: trace
    pattern: 'From the second round on'
    match: not_contains
  - name: gives-the-color
    type: regex
    pattern: '^COLOR:\s*yellow'
    flags: mi
  - name: ends-with-its-report
    type: regex
    pattern: '```gdd-report\s*\nskill: gdd-review'
