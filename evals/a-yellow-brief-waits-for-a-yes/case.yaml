schema_version: "1.1"
name: a-yellow-brief-waits-for-a-yes
description: "A shop prepared with the template's defaults, where yellow asks for the person's approval of its brief. Asked to show the catalog in pages, the orchestrator briefs a yellow change with a rule for twenty products a page and a scenario that tests it, launches nobody to write checks or build, and asks for the approval in under 150 words, with each new or changed rule and each assumption on its own line and one question a yes answers. The brief and its scenarios are in the copy the person has open when it asks."
tags: [orchestrator, brief, person]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, Bash, Write, Edit]
  append_system_prompt: |
    This project's AGENTS.md says:

        ## GDD

        This project uses Gate-Driven Development (contract gdd/1): a change is done when its gates pass, not when an agent says so.

        - No role given? Load the `gdd` skill first.
        - Edit only what your role owns: never a sealed check, and never `gdd/`, `features/` or the agents' own files (`AGENTS.md`, skills, settings) unless your role writes them.
        - Get through gates with facts: the command, its exit code and its last lines.
        - When something doesn't fit, stop and say why.

        Map: `gdd/blueprint.md` zones and gates, `gdd/gates/` their scenarios, `gdd/briefs/` changes, `features/` their scenarios, `gdd/context/` references.

        @gdd/constitution.md
  prompt: |
    Que el catálogo se vea por páginas: veinte productos en cada una, en el orden en que están ahora. Si alguien pide una página que no existe, que vea la primera. Lo demás decídelo tú.
context:
  scaffold_script: scaffold.sh
graders:

  - name: loads-gdd
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gdd"'
  - name: logs-it-as-yellow
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.jsonl }
    pattern: '"step"\s*:\s*"brief"[^\n]*"result"\s*:\s*"yellow"'
    weight: 2
  - name: a-scenario-has-twenty-a-page
    type: regex
    target: trace
    pattern: 'features/[\w./-]+\.feature[^\n]{0,8000}?(?:Scenario|Escenario)[^\n]{0,3000}?(?:(?<![\d:])20(?![\d:])|[Vv]einte|[Tt]wenty)'
    weight: 2
  - name: the-brief-is-in-their-copy
    type: regex
    target: { source: file, path: gdd/briefs/catalog-pages.md }
    # Scenario ids belong in the opening metadata. The owner sees the feature link before technical details.
    pattern: '(?<![\s\S])---\r?\n(?:(?!^---$)[\s\S])*?^scenarios:[ \t]*(?:\[[ \t]*[\w-]+-\d+|(?:\r?\n[ \t]+-[ \t]+[\w-]+-\d+))(?:(?!^---$)[\s\S])*?^---$(?:(?!^##[ \t]+(?:What it touches|Gates|Decisions|Undoing it|Technical|Color)\b)[\s\S])*?features/[\w./-]+\.feature\b'
    flags: im
    weight: 2
  - name: puts-the-sealed-files-before-the-paths
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.jsonl }
    pattern: '"step"\s*:\s*"brief"[^\n]*"files"\s*:\s*\{(?=[^}]*"gdd/briefs/[\w.-]+\.md"\s*:)(?=[^}]*"features/[\w./-]+\.feature"\s*:)'
    weight: 2
  - name: the-rules-come-before-the-cases
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)features/[\w./-]+\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)(?:(?!(?<!\\)"|\\n[\w-]+(?:\\n|")).)*?Rule:
      (?=[^"\\]*\b(?:20|twenty|veinte)\b)(?=[^"\\]*\b(?:pag(?:e|es|ina|inas)|páginas?)\b)(?:[^"\\\n]|\\(?!n).)*(?:\\n[ \t]*)+(?=(?:@[\w:.-]+(?:[ \t]|\\n)+)*@brief:catalog-pages\b)(?:@[\w:.-]+(?:[ \t]|\\n)+)*@id:[\w.-]+(?:[ \t]+|\\n[ \t]*)+(?:@[\w:.-]+(?:[ \t]+|\\n[ \t]*)+)*(?:Scenario|Escenario):
      (?:(?!\\n[ \t]*(?:Rule:|Scenario:|Escenario:|@|[\w-]+(?:\\n|"))|(?<!\\)").)*?\\n[ \t]*(?:When|Cuando)
      (?:[^"\\\n]|\\(?!n).)*(?:\\n[ \t]*)+(?:Then|Entonces)
      (?=(?:[^"\\\n]|\\(?!n).)*\b(?:\d+|twenty|veinte)\b)(?:[^"\\\n]|\\(?!n).)*
    flags: i
    weight: 2
  - name: each-new-page-scenario-has-one-action-and-an-example
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)features/[\w./-]+\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)(?:(?!(?<!\\)"|\\n[\w-]+(?:\\n|")).)*?(?:Rule:
      (?=[^"\\]*\b(?:pages?|páginas?)\b)(?:(?!\\n[ \t]*Rule:|\\n[\w-]+(?:\\n|")|(?<!\\)").)*?\\n[ \t]*|@brief:catalog-pages(?:[ \t]|\\n)+(?:@[\w:.-]+(?:[ \t]|\\n)+)*)(?:Scenario|Escenario):
      (?!(?:[^"\\\n]|\\[^n\n])*(?=(?:(?!\\n[ \t]*(?:Rule:|Scenario:|Escenario:|@|[\w-]+(?:\\n|"))|(?<!\\)").)*?(?:\b(?:\d+|zero|one|two|twenty|cero|uno|dos|veinte)\b|\\"))(?:(?:\\n[ \t]*)+(?:Given|Dad[oa]|And|Y|But|Pero)
      (?:[^"\\\n]|\\[^n\n])*)*(?:\\n[ \t]*)+(?:When|Cuando)
      (?:[^"\\\n]|\\[^n\n])*(?:(?:\\n[ \t]*)+(?:Then|Entonces|And|Y|But|Pero)
      (?:[^"\\\n]|\\[^n\n])*)+(?=(?:\\n[ \t]*)*(?:@|Rule:|Scenario:|Escenario:|[\w-]+(?=\\n|")|(?<!\\)")))
    flags: i
    match: not_contains
    weight: 1
  - name: marks-added-page-rules-as-assumed
    type: regex
    target: trace
    pattern: >-
      (?:"name":"(?:Write|Edit)","input":\{"file_path":"[^"]*?|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?>>?[ \t]*(?:\\?["'])?(?:[^\s"\\;|&<>]*/)?)features/[\w./-]+\.feature(?:","(?:old_string":"(?:[^"\\]|\\.)*",")?(?:content|new_string)":"|(?:\\?["'])?[ \t]+<<-?[ \t]*[\w'\\\"-]+\\n|(?:\\?["'])?\\n)(?:(?!(?<!\\)"|\\n[\w-]+(?:\\n|")).)*?(?<!@assumed(?:[ \t]|\\n)+)Rule:
      (?:(?![^"\\]*\b(?:20|twenty|veinte|order|orden|first|primera|doesn.t exist|missing|nonexistent|out of range|no existe)\b)|(?=[^"\\]*(?:numbered from|number of pages|how many pages|empty catalog|catálogo vacío|numerad[ao]s? desde|cuántas páginas)))
    flags: i
    match: not_contains
    weight: 1
  - name: the-scenarios-are-in-their-copy
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*/cwd/features/[\w.-]+\.feature"|"command":"(?:(?!worktree|cd )(?:[^"\\]|\\.))*?(?:>>?|\bcp\b(?:[^"\\]|\\.)*?)\s?features/[\w.-]+\.feature'
    weight: 2
  - name: builds-nothing-before-the-approval
    type: tool_used
    tool: Agent
    input_match: 'gdd-(?:build|checks)'
    min: 0
    max: 0
    weight: 3
  - name: logs-that-it-waits-for-the-person
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.jsonl }
    pattern: '"event"\s*:\s*"ask"\s*,\s*"of"\s*:\s*"brief"'
    weight: 2
  - name: stays-under-150-words
    type: regex
    pattern: '^\s*(?:\S+\s+){149}\S'
    match: not_contains
    weight: 2
  - name: the-message-says-twenty-a-page
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:(?<![\d:])20(?![\d:])|[Vv]einte|[Tt]wenty)'
    weight: 2
  - name: names-no-file-of-the-method
    type: regex
    target: trace
    pattern: '"result":"(?:[^"\\]|\\.)*?(?:SKILL\.md|references/|skills/gdd)'
    match: not_contains
  - name: asks-to-approve-the-brief
    type: llm
    criteria: Would answering yes approve what the change will do before building begins?
    weight: 3
  - name: ends-on-one-question
    type: regex
    pattern: '^[^?]*\?[ \t*_”»]*\s*$'
    weight: 3
  - name: names-the-feature-file
    type: regex
    pattern: '\bfeatures/[\w./-]+\.feature\b'
    weight: 3
  - name: gives-each-rule-its-own-line
    type: llm
    criteria: Does each new or changed pagination rule occupy its own line in the approval message?
    weight: 3
  - name: marks-assumptions-on-separate-lines
    type: llm
    criteria: Is each assumption presented on a separate line as the agent’s own choice?
    weight: 3
  - name: states-outstanding-questions
    type: llm
    criteria: Are any product questions deferred by the message identified for later decision?
    weight: 3
  - name: states-owner-relevant-technical-decisions
    type: llm
    criteria: Are the implementation choices that affect the owner made explicit?
    weight: 3
  - name: records-no-approval-it-was-not-given
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.jsonl }
    pattern: '"event"\s*:\s*"approval"'
    match: not_contains
    weight: 2
  - name: writes-no-line-of-the-log-by-hand
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit|MultiEdit)","input":\{(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*gdd/log/|"name":"Bash","input":\{"command":"(?:(?!git clone|worktree add|mktemp|\$TMPDIR)(?:[^"\\]|\\.))*?(?:>>?\s*|\btee\s+(?:-a\s+)?|\bsed\s+-i[^|;&"]*?)[^\s"\\|;&<>]*gdd/log/[\w.-]+\.jsonl'
    match: not_contains
    weight: 2
  - name: every-log-it-starts-has-the-layers-journal
    type: regex
    target: files
    pattern: '^gdd/log/[a-z0-9-]+\.jsonl(?=\n|$)|(?:^|\n)(?!gdd/log/([a-z0-9-]+)\.engine\.jsonl\ngdd/log/\1\.jsonl(?:\n|$))[^\n]*\ngdd/log/[a-z0-9-]+\.jsonl(?=\n|$)'
    match: not_contains
    weight: 2
  - name: the-log-gets-no-role-before-the-yes
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.jsonl }
    pattern: '"step"\s*:\s*"(?:checks|build)"'
    match: not_contains
    weight: 2
  - name: no-role-worked-before-the-yes
    type: regex
    target: trace
    pattern: 'gdd \{[\\"]{1,8}command[\\"]{1,8}:[\\"]{1,8}report[\\"]{1,8}[^}]*?needs-approval'
    match: not_contains
    weight: 2
  - name: the-layer-wrote-the-brief-and-the-ask
    type: regex
    target: { source: file, path: gdd/log/catalog-pages.engine.jsonl }
    pattern: '"wrote"\s*:\s*\{[^}]*"step"\s*:\s*"brief"[\s\S]*"wrote"\s*:\s*\{[^}]*"event"\s*:\s*"ask"'
    weight: 2
  - name: claims-no-build-or-shipment
    type: llm
    criteria: Does the owner learn that the catalog change is still unbuilt?
  - name: separates-page-size-from-the-missing-page-rule
    type: regex
    pattern: '^(?![^\n]*(?:(?:a )?page (?:past|beyond) the last(?: one| page)?|inexistente|no existe|out.of.range|nonexistent|doesn.t exist|does not exist))(?=[^\n]*(?:de (?:20 en 20|veinte en veinte)|(?:twenty|veinte|20)\s+(?:products?|productos?)|(?:products?|productos?)\s+(?:per|por) (?:page|página)[^\n]{0,12}(?:twenty|veinte|20)))[^\n]*$\n[\s\S]*?^(?![^\n]*(?:de (?:20 en 20|veinte en veinte)|(?:twenty|veinte|20)\s+(?:products?|productos?)|(?:products?|productos?)\s+(?:per|por) (?:page|página)[^\n]{0,12}(?:twenty|veinte|20)))(?=[^\n]*(?:(?:a )?page (?:past|beyond) the last(?: one| page)?|inexistente|no existe|out.of.range|nonexistent|doesn.t exist|does not exist))[^\n]*(?:primera|first)|^(?![^\n]*(?:de (?:20 en 20|veinte en veinte)|(?:twenty|veinte|20)\s+(?:products?|productos?)|(?:products?|productos?)\s+(?:per|por) (?:page|página)[^\n]{0,12}(?:twenty|veinte|20)))(?=[^\n]*(?:(?:a )?page (?:past|beyond) the last(?: one| page)?|inexistente|no existe|out.of.range|nonexistent|doesn.t exist|does not exist))[^\n]*(?:primera|first)[^\n]*$\n[\s\S]*?^(?![^\n]*(?:(?:a )?page (?:past|beyond) the last(?: one| page)?|inexistente|no existe|out.of.range|nonexistent|doesn.t exist|does not exist))(?=[^\n]*(?:de (?:20 en 20|veinte en veinte)|(?:twenty|veinte|20)\s+(?:products?|productos?)|(?:products?|productos?)\s+(?:per|por) (?:page|página)[^\n]{0,12}(?:twenty|veinte|20)))'
    flags: im
  - name: records-the-question-before-sending
    type: regex
    pattern: '"id":"([^"]+)","name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*?(?:^|(?<="command":")|(?:\\n|&&|\|\||[;|])\s*|\$\()\s*(?:[({]\s*)*(?:[A-Za-z_]\w*=(?:[^\s"\\]|\\.)*\s+)*(?:(?:\\")?(?:\$\w+|~)?/?(?:[\w.-]+/)*\.?gdd/gdd(?:\\")?|gdd|(?:\\")?\$[A-Za-z_][A-Za-z0-9_]*(?:\\")?)\s+ask\s+(?:[^"\\]|\\.)*?"[^\n]*\n[\s\S]*?"tool_use_id":"\1","type":"tool_result","content":"(?:[^"\\]|\\.)*?(?:wrote the ask, line \d+|gdd \{\\"command\\":\\"ask\\"[^}\n]*?\\"line\\":\d+)'
    flags: m
    target: trace
