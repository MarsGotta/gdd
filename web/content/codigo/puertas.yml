# .github/workflows/puertas.yml
name: Puertas
on: pull_request

permissions:
  contents: read

jobs:
  puerta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Las comprobaciones siguen intactas
        env:
          RAMA: ${{ github.head_ref }}
          # Lo que puede cambiar sin comprobaciones aprobadas: lo que marcas como verde.
          VERDES: '^(docs/|README\.md$)'
        run: |
          BASE="$(git merge-base origin/main HEAD)"
          REF="origin/comprobacion/$RAMA"
          if ! git rev-parse --verify -q "$REF" > /dev/null; then
            REF="$BASE"
            FUERA="$(git diff --name-only "$BASE" HEAD | grep -vE "$VERDES" || true)"
            if [ -n "$FUERA" ]; then
              echo "::error::Esta rama no tiene comprobacion/$RAMA y toca más que lo verde:"
              echo "$FUERA"
              exit 1
            fi
          fi
          git diff --exit-code --no-renames --diff-filter=DM "$REF" HEAD -- tests/
          # Lo que decide cómo se ejecutan los tests también cuenta como comprobación. Ajústalo a tu proyecto.
          git diff --exit-code "$REF" HEAD -- package.json package-lock.json 'vitest.config.*' 'vite.config.*'
      - run: npm ci
      - run: npm test
