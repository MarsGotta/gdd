# Gate commands. Filled in during the Setup, once the technology is known.
# Every command runs from the repo root. Empty = not configured.
# Rust: the commands expect cargo on PATH (rustup in ~/.cargo/bin).
# G2 runs without --locked so a change can add a dependency its plan allows; G3 and CI check the lock file.
# Available variables: GDD_CHANGE, GDD_COLOR, GDD_DIFF_FILES (changed paths, one per line),
# GDD_FEATURES (the change's .feature files, one per line; empty = none).
# Scenarios: GDD imposes Gherkin, not a runner. The Setup picks one that fails on undefined or pending steps.

install = "cargo fetch --locked"   # dependencies

[g2]   # Loop Gates: every Builder round
lint = "cargo fmt --all --check && cargo clippy --all-targets -- -D warnings -W clippy::cognitive_complexity"   # complexity: clippy's own rule (threshold 25)
types = ""          # covered by clippy (it type-checks every target)
unit = "cargo test --workspace --exclude gdd-acceptance"
acceptance = "cargo test -p gdd-acceptance"     # cucumber-rs, strict, only GDD_FEATURES (all if empty)
architecture = "mkdir -p target && cargo tree -p gdd-core -e normal > target/gdd-core.tree && ! grep -qE '(ratatui|crossterm|clap) ' target/gdd-core.tree"   # the core never depends on the terminal or the CLI   # dependency rules between layers

[g3]   # Merge Gate: the full automatic chain
acceptance_full = "GDD_FEATURES= GDD_HIDDEN=1 cargo test -p gdd-acceptance --locked"  # every scenario, hidden examples included
lockfile = "cargo metadata --locked --format-version 1 > /dev/null"   # Cargo.lock matches Cargo.toml (G2 may update it; CI checks it is committed)
security = "cargo deny --locked check advisories bans sources"   # known vulnerabilities, banned crates, unknown sources
dependencies = "cargo deny --locked check licenses"
quality = ""          # clippy in G2 covers it for now; Learn may add more
secrets = "BASE=$(git rev-parse -q --verify main || git rev-parse origin/main) && git add -A --intent-to-add && git diff $(git merge-base HEAD $BASE) | gitleaks stdin --no-banner --redact"   # secrets in what the change adds (gitleaks reads the diff)
mutation = "if command -v prlimit >/dev/null; then export CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr a-z- A-Z_)_RUNNER='prlimit --as=2147483648 --' MALLOC_ARENA_MAX=2; fi; BASE=$(git rev-parse -q --verify main || git rev-parse origin/main) && mkdir -p target && git add -A --intent-to-add && git diff $(git merge-base HEAD $BASE) > target/gdd-change.diff && cargo mutants --in-diff target/gdd-change.diff --output target --no-shuffle -j 2"   # only in yellow and red; each test process capped at 2 GB where prlimit exists (a mutant can turn a loop into endless allocation); MALLOC_ARENA_MAX=2 because glibc reserves 64 MB of address space per thread arena and many test threads hit the cap without allocating

[release]
simulated = true      # no real pre/production yet: empty steps pass and are logged as simulated
build = "cargo build --release --locked"
deploy_pre = "install -D target/release/gdd .gdd/pre/gdd"   # pre = a local install of the release binary
tests_pre = ".gdd/pre/gdd --version | grep -q '^gdd '"
demo = "set -o pipefail; mkdir -p .gdd/changes/$GDD_CHANGE/demo && GDD_FEATURES= cargo test -q -p gdd-acceptance --locked 2>&1 | sed 's/\\x1b\\[[0-9;]*m//g' > .gdd/changes/$GDD_CHANGE/demo/scenarios.txt"   # a library has no screen: the demo is the readable run of its scenarios
promote = ""          # the same version, from pre to production
observe = ""          # fails if errors rise
rollback = ""         # back to the previous production version
rollback_pre = ""     # no real pre yet: the self-test logs the rollback as simulated

[learn]   # warnings for Learn (gdd learn), never a gate
duplication = "npx --yes jscpd --silent crates"
unused = "cargo machete"

[selftest]
file = "crates/gdd-core/tests/gdd_selftest_failing.rs"      # path of a deliberately failing test (created and removed)
content = "#[test]\nfn gdd_selftest_must_fail() {\n    panic!(\"gdd selftest\");\n}\n"   # its content
