# Gate commands. Filled in during the Setup, once the technology is known.
# Every command runs from the repo root. Empty = not configured.
# Rust: the commands expect cargo on PATH (rustup in ~/.cargo/bin).
# G2 runs without --locked so a change can add a dependency its plan allows; G3 and CI check the lock file.
# Available variables: GDD_CHANGE, GDD_COLOR, GDD_DIFF_FILES (changed paths, one per line),
# GDD_FEATURES (the change's .feature files, one per line; empty = none).
# Scenarios: GDD imposes Gherkin, not a runner. The Setup picks one that fails on undefined or pending steps.

install = "cargo fetch --locked"   # dependencies

[g2]   # Loop Gates: every Builder round
lint = "cargo fmt --all --check && cargo clippy --all-targets -- -D warnings -W clippy::cognitive_complexity"   # complexity: clippy's own rule (threshold 25)
types = ""          # covered by clippy (it type-checks every target)
unit = "cargo test --workspace --exclude gdd-acceptance"
acceptance = "cargo test -p gdd-acceptance"     # cucumber-rs, strict, only GDD_FEATURES (all if empty)
architecture = "mkdir -p target && cargo tree -p gdd-core -e normal > target/gdd-core.tree && ! grep -qE '(ratatui|crossterm|clap) ' target/gdd-core.tree"   # the core never depends on the terminal or the CLI   # dependency rules between layers
architecture-frontier = '''grep -HciE '\bgit\b|branch|merge|worktree|\.feature|gherkin|scenario|release|promot|cargo' $(cat gdd/core-files.txt) | awk -F: '{n += $2} END {print n + 0 " software lines in the core"; exit n > 0}''''   # the frontier ratchet (ADR 0002 section 6): lines of the core files (gdd/core-files.txt) that name software: git, branches, Gherkin, releases, cargo. Known debt in gdd/debt.toml: it may only go down (Mars, 2026-11-02)

[g3]   # Merge Gate: the full automatic chain
acceptance_full = "GDD_FEATURES= GDD_HIDDEN=1 cargo test -p gdd-acceptance --locked"  # every scenario, hidden examples included
lockfile = "cargo metadata --locked --format-version 1 > /dev/null"   # Cargo.lock matches Cargo.toml (G2 may update it; CI checks it is committed)
security = "cargo deny --locked check advisories bans sources"   # known vulnerabilities, banned crates, unknown sources
dependencies = "cargo deny --locked check licenses"
quality = ""          # clippy in G2 covers it for now; Learn may add more
secrets = '''BASE=$(git rev-parse -q --verify main || git rev-parse origin/main) && M=$(git merge-base HEAD "$BASE") && git add -A --intent-to-add && D=$(mktemp -d) && trap 'rm -rf "$D"' EXIT && git -c core.quotePath=false diff --no-color --no-ext-diff --src-prefix=a/ --dst-prefix=b/ "$M" > "$D/diff" && awk -v w="$D/where" 'function unq(s,r,c,i){r="";s=substr(s,2,length(s)-2);while((i=index(s,"\\"))>0){c=substr(s,i+1,1);if(c!="\""&&c!="\\")c="\\" c;r=r substr(s,1,i-1) c;s=substr(s,i+2)}return r s} /^diff /{h=0;next} /^@@ /{h=1;split($3,a,",");n=substr(a[1],2)+0;next} !h{if(/^\+\+\+ /){f=substr($0,5);sub(/\t$/,"",f);if(f~/^"/)f=unq(f);sub(/^b\//,"",f)}next} /^\+/{print substr($0,2);print f":"n > w;n++;next} !/^-/&&!/^\\/{n++}' "$D/diff" > "$D/added" && printf '{{range .}}{{.StartLine}} {{.RuleID}}\n{{end}}' > "$D/report" || { echo 'secrets: the lines the change adds could not be read, so no secret was checked'; exit 2; }; gitleaks stdin --no-banner --redact --log-level error --report-format template --report-template "$D/report" --report-path "$D/found" < "$D/added" && exit 0; s=$?; [ ! -f "$D/found" ] || sort -n "$D/found" | while read -r n rule; do printf 'secrets: %s: %s (value not shown)\n' "$(sed -n "${n}p" "$D/where")" "$rule"; done; exit $s'''   # secrets in the lines the change adds: path:line and the rule of each finding, never the value
mutation = '''export CARGO_PROFILE_TEST_DEBUG=0; if command -v prlimit >/dev/null; then export CARGO_TARGET_$(rustc -vV | sed -n 's/^host: //p' | tr a-z- A-Z_)_RUNNER='prlimit --as=2147483648 --' MALLOC_ARENA_MAX=2; fi; if command -v mold >/dev/null && [ -z "${RUSTFLAGS:-}" ]; then export RUSTFLAGS='-C link-arg=-fuse-ld=mold'; fi; BASE=$(git rev-parse -q --verify main || git rev-parse origin/main) && mkdir -p target && git add -A --intent-to-add && git diff $(git merge-base HEAD $BASE) > target/gdd-change.diff && { missed_too() { if [ $code -eq 3 ] && [ -s target/mutants.out/missed.txt ]; then echo "$(wc -l < target/mutants.out/missed.txt | tr -d ' ') mutant(s) missed besides the timeouts"; code=2; fi; }; cargo mutants --in-diff target/gdd-change.diff --output target --no-shuffle -j 2; code=$?; missed_too; if [ $code -eq 3 ]; then cargo mutants --in-diff target/gdd-change.diff --output target --no-shuffle --iterate -j 1 --minimum-test-timeout 120; code=$?; missed_too; if [ $code -eq 3 ]; then if [ -f target/mutants.out/timeout.txt ]; then n=$(wc -l < target/mutants.out/timeout.txt | tr -d ' '); else n=some; fi; echo "$n mutant(s) hung again: counted as caught"; code=0; fi; fi; exit $code; }'''   # only in yellow and red; the stack sheet's command (mutation-speed): mutants built without debug info and linked with mold when it is installed (unless RUSTFLAGS is set); each test process capped at 2 GB where prlimit exists (a mutant can turn a loop into endless allocation), MALLOC_ARENA_MAX=2 so glibc's arenas do not fill that cap; cargo-mutants exits 3 when a mutant timed out even if others were missed, so after each run a missed.txt that is not empty turns 3 into 2 (missed mutants fail the gate); a 3 with none missed gets a second chance (--iterate retries the missed and timed-out ones), one at a time with at least 120 s per test: a mutant that hangs again counts as caught, as Stryker counts it

[count]   # how to read what a command reports, for the known-debt ratchet
architecture-frontier = ["{n} software lines in the core"]

[release]
simulated = true      # no real pre/production yet: empty steps pass and are logged as simulated
build = "cargo build --release --locked"
deploy_pre = "install -D target/release/gdd .gdd/pre/gdd"   # pre = a local install of the release binary
tests_pre = ".gdd/pre/gdd --version | grep -q '^gdd '"
demo = "set -o pipefail; mkdir -p .gdd/changes/$GDD_CHANGE/demo && GDD_FEATURES= cargo test -q -p gdd-acceptance --locked 2>&1 | sed 's/\\x1b\\[[0-9;]*m//g' > .gdd/changes/$GDD_CHANGE/demo/scenarios.txt"   # a library has no screen: the demo is the readable run of its scenarios
promote = ""          # the same version, from pre to production
observe = ""          # fails if errors rise
rollback = ""         # back to the previous production version
rollback_pre = ""     # no real pre yet: the self-test logs the rollback as simulated

[learn]   # warnings for Learn (gdd learn), never a gate
duplication = "npx --yes jscpd --silent crates"
unused = "cargo machete"

[selftest]
file = "crates/gdd-core/tests/gdd_selftest_failing.rs"      # path of a deliberately failing test (created and removed)
content = "#[test]\nfn gdd_selftest_must_fail() {\n    panic!(\"gdd selftest\");\n}\n"   # its content
