[package]
name = "gdd"
version = "0.11.2"
edition = "2024"
rust-version = "1.89"
description = "The deterministic layer of Gate-Driven Development (contract gdd/1): order, accounting and evidence for changes built by coding agents."
license = "MIT"
publish = false

[lib]
name = "gdd"
path = "src/lib.rs"

[[bin]]
name = "gdd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
