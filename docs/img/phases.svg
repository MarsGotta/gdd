<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 930" role="img" aria-label="The six phases and five gates of GDD, with the way back when a gate says no" font-family="Inter, system-ui, sans-serif">
<rect width="100%" height="100%" rx="16" fill="#0d1020"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a9cc"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb36b"/></marker>
</defs>
<text x="24" y="36" fill="#e8eaf6" font-size="19" font-weight="700">Phases and gates</text>
<rect x="20" y="52" width="560" height="62" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1"/>
<rect x="36" y="64" width="14" height="14" rx="3" fill="#2a2350" stroke="#d6a6ff" stroke-width="2"/><text x="58" y="76" fill="#a3a9cc" font-size="13">a person decides</text>
<rect x="306" y="64" width="14" height="14" rx="3" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/><text x="328" y="76" fill="#a3a9cc" font-size="13">the machines decide</text>
<line x1="36" y1="98" x2="66" y2="98" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="76" y="102" fill="#a3a9cc" font-size="13">a gate says no: back to fix it</text>
<line x1="306" y1="98" x2="336" y2="98" stroke="#ffb36b" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#m)"/><text x="346" y="102" fill="#a3a9cc" font-size="13">Learn hardens the gates</text>
<line x1="280" y1="168.0" x2="280" y2="188.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="230.0" x2="280" y2="250.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="296.0" x2="280" y2="316.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="358.0" x2="280" y2="378.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="424.0" x2="280" y2="444.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="486.0" x2="280" y2="506.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="552.0" x2="280" y2="572.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="614.0" x2="280" y2="634.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<line x1="280" y1="680.0" x2="280" y2="700.0" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<rect x="190.0" y="124.0" width="180" height="44" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1.5"/>
<text x="280" y="143" text-anchor="middle" fill="#e8eaf6" font-size="15" font-weight="600">0 Setup</text><text x="280" y="160" text-anchor="middle" fill="#a3a9cc" font-size="11.5">once per project</text>
<path d="M189.0 190.0 H371.0 L385.0 210 L371.0 230.0 H189.0 L175.0 210 Z" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="280" y="215" text-anchor="middle" fill="#4fd18b" font-size="14" font-weight="700">G0 · Setup Gate</text>
<rect x="190.0" y="252.0" width="180" height="44" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1.5"/>
<text x="280" y="279" text-anchor="middle" fill="#e8eaf6" font-size="15" font-weight="600">1 Discover</text>
<path d="M189.0 318.0 H371.0 L385.0 338 L371.0 358.0 H189.0 L175.0 338 Z" fill="#2a2350" stroke="#d6a6ff" stroke-width="2"/>
<text x="280" y="343" text-anchor="middle" fill="#d6a6ff" font-size="14" font-weight="700">G1 · Scenario Gate</text>
<rect x="190.0" y="380.0" width="180" height="44" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1.5"/>
<text x="280" y="407" text-anchor="middle" fill="#e8eaf6" font-size="15" font-weight="600">2 Build</text>
<path d="M189.0 446.0 H371.0 L385.0 466 L371.0 486.0 H189.0 L175.0 466 Z" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="280" y="471" text-anchor="middle" fill="#4fd18b" font-size="14" font-weight="700">G2 · Loop Gates</text>
<rect x="190.0" y="508.0" width="180" height="44" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1.5"/>
<text x="280" y="535" text-anchor="middle" fill="#e8eaf6" font-size="15" font-weight="600">3 Integrate</text>
<path d="M189.0 574.0 H371.0 L385.0 594 L371.0 614.0 H189.0 L175.0 594 Z" fill="#1a1f3d" stroke="#4fd18b" stroke-width="2"/>
<text x="280" y="599" text-anchor="middle" fill="#4fd18b" font-size="14" font-weight="700">G3 · Merge Gate</text>
<rect x="190.0" y="636.0" width="180" height="44" rx="10" fill="#1a1f3d" stroke="#2b3263" stroke-width="1.5"/>
<text x="280" y="663" text-anchor="middle" fill="#e8eaf6" font-size="15" font-weight="600">4 Release</text>
<path d="M189.0 702.0 H371.0 L385.0 722 L371.0 742.0 H189.0 L175.0 722 Z" fill="#2a2350" stroke="#d6a6ff" stroke-width="2"/>
<text x="280" y="727" text-anchor="middle" fill="#d6a6ff" font-size="14" font-weight="700">G4 · Release Gate</text>
<path d="M385.0 210 H408 Q420 210 420 198 V158 Q420 146 408 146 H373.0" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<path d="M385.0 338 H408 Q420 338 420 326 V286 Q420 274 408 274 H373.0" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<path d="M385.0 466 H408 Q420 466 420 454 V404 Q420 392 408 392 H373.0" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<path d="M385.0 594 H438 Q450 594 450 582 V416 Q450 404 438 404 H373.0" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<path d="M385.0 722 H468 Q480 722 480 710 V426 Q480 414 468 414 H373.0" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<path d="M175.0 722 H82 Q70 722 70 710 V286 Q70 274 82 274 H187.0" fill="none" stroke="#a3a9cc" stroke-width="2" marker-end="url(#a)"/>
<rect x="24.700000000000003" y="487" width="90.6" height="22" rx="11" fill="#0d1020" stroke="#e8eaf6" stroke-width="1.2"/><text x="70" y="502.5" text-anchor="middle" fill="#e8eaf6" font-size="12">next change</text>
<path d="M280 742.0 V844.0 H302" fill="none" stroke="#ffb36b" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#m)"/>
<rect x="214.9" y="769" width="130.2" height="22" rx="11" fill="#0d1020" stroke="#ffb36b" stroke-width="1.2"/><text x="280" y="784.5" text-anchor="middle" fill="#ffb36b" font-size="12">from time to time</text>
<rect x="305" y="792" width="275" height="104" rx="12" fill="#1a1f3d" stroke="#ffb36b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="321" y="822" fill="#ffb36b" font-size="15" font-weight="700">5 Learn</text>
<text x="321" y="846" fill="#e8eaf6" font-size="12.5">Repeated problems become rules,</text>
<text x="321" y="865" fill="#e8eaf6" font-size="12.5">lints and tests that G2 and G3</text>
<text x="321" y="884" fill="#e8eaf6" font-size="12.5">check on every later change.</text>
</svg>
