# Agent sheet · Codex CLI (https://developers.openai.com/codex/skills, /codex/noninteractive)
name = "codex"
title = "Codex"
binary = "codex"
usage = "codex-jsonl"      # turn.completed events carry the usage; no cost

[commands]
path = ".agents/skills/{name}/SKILL.md"   # {name} is gdd-<command>
format = "skill"                           # frontmatter with name and description
invoke = "${name}"                         # skills are called with a dollar sign

[launch]
args = ["exec", "{role_args}", "{invoke} {args}", "--model", "{model}", "--json"]
# Added to the role's arguments when the role's table in gdd/models.toml has `effort`.
effort_args = ["-c", "model_reasoning_effort={effort}"]

# The sandbox of workspace-write writes only the folder the agent runs in, the change's worktree,
# and the folders of --add-dir ({state} is the state root). A Builder may also write its own
# change's state folder, where the gdd commands it runs keep their notes and the G2 report: a
# gdd an agent starts never writes the shared log. The Orchestrator writes its replan there too.
# The Reviewer only reads.
[roles.builder-build]
args = ["--sandbox", "workspace-write", "--add-dir", "{state}/.gdd/changes/{change}", "-c", "mcp_servers={}"]

[roles.builder-test]
args = ["--sandbox", "workspace-write", "--add-dir", "{state}/.gdd/changes/{change}", "-c", "mcp_servers={}"]

[roles.reviewer]
args = ["--sandbox", "read-only", "-c", "mcp_servers={}"]

[roles.orchestrator]
args = ["--sandbox", "workspace-write", "--add-dir", "{state}/.gdd/changes/{change}", "-c", "mcp_servers={}"]
