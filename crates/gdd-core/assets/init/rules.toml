# Rules table · GDD (written by gdd init {version})
# Single source of truth: read by the classifier, the recipe and CI. Color beats work type and lane.

main_branch = "{main}"
push_main = false   # true = push main after the Merge Gate (once there is a remote and CI)

[acceptance]
dir = "features"                    # Gherkin scenarios (.feature)
regression = "features/regression"  # changes here do not trigger G1
required = true                     # zero scenarios counts as a G3 failure

[limits]
builder_retries = 3   # Builder rounds against G2
replans = 1           # Orchestrator replans per stuck change
reviewer_fixes = 1
command_seconds = 1800   # how long each gate and release command may run; raise it on a slow machine

[spike]
max_usd = 5   # a spike parks when its agent calls cost this much (USD)

# What each color gets. "fast" only exists when the color is not red, no .feature changes
# and the Orchestrator marks the change as resumable.
# Red changes always get mutation testing, the Reviewer and the human G4: the core of GDD.
# review: how deep the Reviewer looks, "quick" or "deep". Red changes always get the deep one.
[color.green.fast]
tests_first = false
mutation = false
reviewer = false
g4_if_g1 = false
review = "quick"      # review = "deep" here asks for a deep review

[color.green.full]
tests_first = true
mutation = false
reviewer = true
g4_if_g1 = true
review = "quick"      # review = "deep" here asks for a deep review

[color.yellow.fast]
tests_first = true    # characterization tests before touching
mutation = false      # mutation = true here runs it on yellow changes too
reviewer = true
g4_if_g1 = false
review = "quick"      # review = "deep" here asks for a deep review

[color.yellow.full]
tests_first = true
mutation = false      # mutation = true here runs it on yellow changes too
reviewer = true
g4_if_g1 = true
review = "quick"      # review = "deep" here asks for a deep review

[color.red.full]
tests_first = true
mutation = true
reviewer = true       # also checks security
g4_if_g1 = true       # in red, G4 always happens
review = "deep"

# Paths each role must not change. Path Guard checks them in G2 and in CI.
[protected]
all = ["gdd/**", "bin/**", ".github/**", ".claude/**", ".agents/**", ".opencode/**", ".gdd/bin/**", "AGENTS.md", "CLAUDE.md"]
builder_build = {builder_build}   # approved scenarios and the steps written in test mode
builder_test = {builder_test}   # production code: test mode only writes tests and steps
reviewer = ["**"]
