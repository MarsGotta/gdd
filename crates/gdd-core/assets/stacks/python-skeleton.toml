[[file]]
path = "tests/acceptance/test_features.py"
content = '''
"""Binds the Gherkin scenarios to the steps (pytest-bdd).

G2 runs the features in GDD_FEATURES (one path per line; all of features/
when empty) and never features/hidden/; G3 sets GDD_HIDDEN=1 to run those
too. Steps live in tests/acceptance/steps/.
"""

import os
from pathlib import Path

from pytest_bdd import scenarios

from tests.acceptance.steps import *  # noqa: F403  (the step definitions)

ROOT = Path(__file__).resolve().parents[2]
FEATURES = ROOT / "features"


def _chosen() -> list[Path]:
    lines = os.environ.get("GDD_FEATURES", "").splitlines()
    named = [ROOT / line for line in lines if line.strip()]
    found = named or sorted(FEATURES.glob("**/*.feature"))
    hidden = FEATURES / "hidden"
    if os.environ.get("GDD_HIDDEN") == "1":
        return found
    return [path for path in found if hidden not in path.parents]


for _feature in _chosen():
    scenarios(str(_feature))
'''

[[file]]
path = "tests/unit/__init__.py"
content = '''
'''

[[file]]
path = "tests/unit/test_greeting.py"
content = '''
from {package}.greeting import greeting


def test_a_name_is_greeted_by_name() -> None:
    assert greeting("Ada") == "Hello, Ada!"


def test_no_name_gets_a_plain_greeting() -> None:
    assert greeting("") == "Hello!"
'''

[[file]]
path = "osv-scanner-licenses.toml"
content = '''
# OSV-Scanner for G3 dependencies: licenses only (vulnerabilities are G3 security's job), and only
# of what ships: dev tools are not distributed.
[[PackageOverrides]]
vulnerability.ignore = true
reason = "licenses only"

[[PackageOverrides]]
group = "dev"
license.ignore = true
reason = "dev tools are not shipped"
'''
